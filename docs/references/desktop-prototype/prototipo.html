<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Te Tengo Captura</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500;600&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- Te Tengo: tokens (heredados de la app móvil) ---------- */
:root{
  --ground:#EEF0F4;
  --ground-2:#E4E6EC;
  --card:#FFFFFF;
  --ink:#221A38;
  --ink-2:#4F4766;
  --ink-3:#655D7A;
  --line:#D9D7E1;
  --line-2:#C7C3D3;
  --morado:#4A2A85;
  --morado-press:#3A1F6C;
  --morado-soft:#ECE7F6;
  --morado-ink:#3B2270;
  --coral:#E8765A;      /* solo marca */
  --durazno:#FFB59C;    /* solo marca */
  --caida:#BF2A1B;
  --caida-deep:#951D11;
  --caida-soft:#FBE8E5;
  --caida-ink:#9C2012;
  --calma:#1C7A4C;
  --calma-soft:#E2F2E9;
  --calma-ink:#145C39;
  --aviso:#8F5400;
  --aviso-soft:#FBEFD9;
  --pausa:#4E5B74;
  --pausa-soft:#E6E9F0;
  --focus:#4A2A85;
  --shadow-1:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --shadow-2:0 8px 28px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.08);
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  /* escala de escritorio (densidad de ventana, misma familia de radios) */
  --r-card:18px;
  --r-ctl:12px;
  --r-win:10px;
  --tb-h:36px;
}
*{box-sizing:border-box}
::selection{background:var(--morado-soft);color:var(--morado-ink)}
h1,h2,h3,p,dl,dd,figure{margin:0}
button{font:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.grow{flex:1;min-width:0}
.center{text-align:center}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}.mt28{margin-top:28px}

/* ---------- Ventana ---------- */
.win{position:relative;width:960px;height:640px;border-radius:var(--r-win);overflow:hidden;background:var(--ground);color:var(--ink);
  font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;isolation:isolate;
  box-shadow:0 0 0 1px rgba(34,26,56,.16),0 24px 48px -18px rgba(23,18,31,.38),0 4px 12px rgba(23,18,31,.08);caret-color:var(--morado)}
.win.flat{box-shadow:0 0 0 1px rgba(34,26,56,.16)}
.tb{height:var(--tb-h);flex:none;display:flex;align-items:center;background:#F8F8FA;box-shadow:0 1px 0 var(--line);user-select:none;position:relative;z-index:8}
.tb-app{display:flex;align-items:center;gap:10px;padding-left:12px;flex:1;font-size:13px;font-weight:600;color:var(--ink-2)}
.tb-btns{display:flex;height:100%}
.tb-btn{width:46px;height:100%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:default;border-radius:0;padding:0}
.tb-btn svg{width:10px;height:10px}
.tb-btn:hover{background:rgba(34,26,56,.07)}
.tb-btn.close:hover{background:#C42B1C;color:#fff}
.tb-btn[aria-disabled="true"]{color:#B9B4C6}
.tb-btn[aria-disabled="true"]:hover{background:transparent}
.tb-btn:focus-visible{outline-offset:-3px;border-radius:0}
.wb{flex:1;position:relative;overflow:hidden;min-height:0}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.scr.enter{animation:enter .22s var(--ease)}
.scr.enter-back{animation:enterb .22s var(--ease)}
@keyframes enter{from{transform:translateX(18px);opacity:.2}}
@keyframes enterb{from{transform:translateX(-18px);opacity:.2}}

/* app icon */
.appicon{width:40px;height:40px;border-radius:23.3%;display:block;flex:none}
.appicon.xs{width:18px;height:18px}
.appicon.sm{width:26px;height:26px}
.appicon svg,.appicon.xs svg,.appicon.sm svg{display:block;width:100%;height:100%}

/* ---------- Tipografía ---------- */
.t-display{font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.02em;text-wrap:balance;max-width:16ch}
.t-title{font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.015em;text-wrap:balance}
.t-h2{font-size:18px;line-height:1.25;font-weight:800}
.t-lead{font-size:16px;line-height:1.5;color:var(--ink-2);max-width:46ch}
.t-small{font-size:14.5px;line-height:1.45;color:var(--ink-2)}
.t-meta{font-size:13.5px;line-height:1.4;color:var(--ink-3)}
.h-sub{color:var(--ink-2);font-weight:700;display:block;margin-top:2px}
.path{display:inline-flex;align-items:center;gap:2px;font-weight:700;color:var(--ink)}
.path svg{width:16px;height:16px;color:var(--ink-3)}

/* ---------- Botones ---------- */
.btn{appearance:none;border:0;font:inherit;font-size:15.5px;font-weight:700;height:44px;padding:0 18px;border-radius:var(--r-ctl);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap;text-decoration:none;
  transition:background .15s,box-shadow .15s,color .15s,transform .12s var(--ease)}
.btn svg{width:20px;height:20px;flex:none}
.btn-lg{height:50px;font-size:16.5px;padding:0 24px}
.btn-sm{height:38px;font-size:14.5px;padding:0 14px;border-radius:10px}
.btn-sm svg{width:18px;height:18px}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--morado);color:#fff}
.btn-primary:hover{background:var(--morado-press)}
.btn-secondary{background:var(--card);color:var(--morado-ink);box-shadow:0 0 0 1.5px var(--line-2) inset}
.btn-secondary:hover{background:var(--morado-soft);box-shadow:0 0 0 1.5px var(--morado) inset}
.btn-ghost{background:transparent;color:var(--morado-ink)}
.btn-ghost:hover{background:rgba(74,42,133,.1)}
.btn-ondark{background:rgba(255,255,255,.12);color:#fff;box-shadow:0 0 0 1.5px rgba(255,255,255,.4) inset}
.btn-ondark:hover{background:rgba(255,255,255,.2)}
.btn[disabled]{background:var(--ground-2);color:#7D7690;box-shadow:none;cursor:not-allowed;transform:none}
.btn.loading{pointer-events:none}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 10px;border-radius:10px;border:0;background:transparent;font-size:15px;font-weight:700;color:var(--morado-ink);cursor:pointer}
.back:hover{background:var(--morado-soft)}
.back svg{width:20px;height:20px}

/* ---------- Formularios ---------- */
.label{display:block;font-size:14.5px;font-weight:700;margin-bottom:6px}
.input{width:100%;height:44px;border-radius:var(--r-ctl);border:1.5px solid var(--line-2);background:#fff;font:inherit;font-size:15.5px;color:var(--ink);padding:0 14px;
  transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:#7A7389}
.input:hover{border-color:#ABA5BB}
.input:focus{outline:none;border-color:var(--morado);box-shadow:0 0 0 3px var(--morado-soft)}
.input.mono{font-family:var(--mono);letter-spacing:.01em}
.field{min-width:0}
.field.err .input,.field.err .code-box{border-color:var(--caida);box-shadow:0 0 0 3px var(--caida-soft)}
.field.ok .code-box{border-color:var(--calma)}
.field-msg{display:flex;gap:7px;align-items:flex-start;font-size:14px;line-height:1.4;margin-top:7px;color:var(--ink-3)}
.field-msg svg{width:17px;height:17px;flex:none;margin-top:1px}
.field-msg b{font-weight:800}
.field.err .field-msg{color:var(--caida-ink)}
.field.ok .field-msg{color:var(--calma-ink);font-weight:700}

/* vinculación (trabajo futuro, solo en pantallas-trabajo-futuro.html): campo con prefijo fijo */
.code-box{display:flex;align-items:center;width:292px;height:62px;border-radius:14px;border:1.5px solid var(--line-2);background:#fff;padding:0 16px;
  transition:border-color .15s,box-shadow .15s;cursor:text}
.code-box:hover{border-color:#ABA5BB}
.code-box:focus-within{border-color:var(--morado);box-shadow:0 0 0 3px var(--morado-soft)}
.code-pre{font-family:var(--mono);font-size:26px;font-weight:500;color:var(--ink-3);letter-spacing:.1em}
.input-code{border:0!important;box-shadow:none!important;height:100%;padding:0 0 0 2px;font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;background:transparent;min-width:0}
.input-code::placeholder{color:#B4AEC3;letter-spacing:.16em}

/* ---------- Cartas y avisos ---------- */
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow-1)}
.notice{display:flex;gap:12px;padding:12px 14px;border-radius:14px;font-size:14.5px;line-height:1.4;align-items:flex-start}
.notice>svg{width:22px;height:22px;flex:none;margin-top:1px}
.notice b{display:block;font-size:15.5px;margin-bottom:1px}
.notice.err{background:var(--caida-soft);color:var(--caida-ink)}
.notice.err span{color:#6E1A10}
.notice.warn{background:var(--aviso-soft);color:#5E3700}
.notice.ok{background:var(--calma-soft);color:var(--calma-ink)}
.notice.info{background:var(--morado-soft);color:var(--morado-ink)}
.notice.info span{color:var(--ink-2)}

/* ---------- Pantalla: inicio ---------- */
.inicio-grid{flex:1;display:grid;grid-template-columns:1fr 340px;gap:56px;align-items:center;padding:24px 56px 0 64px;min-height:0}
.help{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--ink-2)}
.help>svg{width:20px;height:20px;color:var(--morado);flex:none}
.flow{padding:20px 22px 6px}
.flow ol{list-style:none;margin:0;padding:0}
.flow li{display:grid;grid-template-columns:40px 1fr;gap:14px;padding-bottom:18px;position:relative}
.flow li:not(:last-child)::before{content:"";position:absolute;left:19px;top:44px;bottom:2px;width:2px;background:repeating-linear-gradient(to bottom,var(--line-2) 0 4px,transparent 4px 8px)}
.fl-ico{width:40px;height:40px;border-radius:12px;background:var(--ground);color:var(--ink-2);display:grid;place-items:center}
.fl-ico svg{width:22px;height:22px}
.flow li b{display:flex;align-items:center;gap:8px;font-size:15.5px;flex-wrap:wrap}
.flow li b+span{display:block;font-size:13.5px;color:var(--ink-3);line-height:1.35;margin-top:1px}
.flow li.cur .fl-ico{background:var(--morado);color:#fff}
.here{font-size:12px;font-weight:800;color:var(--morado-ink);background:var(--morado-soft);padding:2px 8px;border-radius:6px}
.scr-foot{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-3);padding:0 0 22px 64px;flex:none}
.scr-foot svg{width:17px;height:17px;flex:none}
.scr-foot .sep{width:1px;height:14px;background:var(--line-2);margin:0 8px}

/* ---------- Pantallas de pasos ---------- */
.scr-top{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:10px 28px 0 22px}
.crumb{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);background:var(--card);border-radius:10px;padding:6px 12px;box-shadow:var(--shadow-1)}
.crumb svg{width:17px;height:17px;color:var(--ink-3)}
.crumb .mono{font-weight:600;color:var(--ink)}
.split{flex:1;display:grid;grid-template-columns:1fr 244px;gap:56px;align-items:center;padding:0 72px 30px 64px;min-height:0}
.aside-ph{display:flex;flex-direction:column;align-items:center}

/* ---------- Pantalla: dispositivo ---------- */
.dev-head{padding:2px 40px 18px 40px;flex:none}
.dev-grid{flex:1;display:grid;grid-template-columns:300px 1fr;gap:22px;padding:0 40px 26px;min-height:0}
.grp-l{font-size:13px;font-weight:700;color:var(--ink-3);margin:0 0 8px 2px}
.grp-l+.grp-l,.opts+.grp-l{margin-top:18px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:9px 14px 9px 10px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--card);
  text-align:left;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}
.opt:hover{border-color:var(--morado)}
.opt.sel{border-color:var(--morado);background:var(--morado-soft);box-shadow:0 0 0 1px var(--morado) inset}
.oi{width:38px;height:38px;border-radius:10px;background:var(--ground);display:grid;place-items:center;color:var(--ink-2);flex:none}
.oi svg{width:21px;height:21px}
.opt.sel .oi{background:#fff;color:var(--morado-ink)}
.opt b{display:block;font-size:15px;line-height:1.3}
.opt .sub{display:block;font-size:13.5px;color:var(--ink-3);line-height:1.35}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink-3);flex:none;display:grid;place-items:center}
.opt.sel .radio{border-color:var(--morado)}
.opt.sel .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--morado)}
.opt[aria-disabled="true"]{background:transparent;border-style:dashed;cursor:not-allowed;color:var(--ink-2)}
.opt[aria-disabled="true"]:hover{border-color:var(--line-2)}
.opt[aria-disabled="true"] .oi{background:var(--ground-2);color:var(--ink-3)}
.opt .tag{font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--ground-2);color:var(--ink-2);white-space:nowrap;flex:none}
.opt .sub.off{color:var(--aviso);font-weight:700}
.pane{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow-1);padding:14px;display:flex;flex-direction:column;min-height:0;min-width:0}
.pane-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:auto;padding:14px 2px 0}
.pane-foot .t-meta{display:flex;align-items:center;gap:7px}
.pane-foot .t-meta svg{width:17px;height:17px;flex:none}
.art{position:relative;overflow:hidden;background:#DCD8E6}
.art svg.room{position:absolute;inset:0;width:100%;height:100%;display:block}
.pv{border-radius:12px;aspect-ratio:16/9;width:100%}
.pane>.pv{flex:1;aspect-ratio:auto;min-height:0}
.pv-tag{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:6px;background:rgba(34,26,56,.74);color:#fff;font-size:13px;font-weight:700;padding:4px 10px 4px 8px;border-radius:8px}
.pv-tag svg{width:16px;height:16px}
.pane-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 40px;gap:8px;border-radius:12px;background:var(--ground);box-shadow:0 0 0 1.5px var(--line-2) inset}
.pane-empty>svg{width:34px;height:34px;color:var(--ink-3);margin-bottom:4px}
.pane-empty .t-small{max-width:44ch}
.pane-empty .btn{margin-top:10px}
.pane-scan{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:12px;background:var(--ground);color:var(--ink-2);font-weight:700}
/* ---------- Pantalla: éxito ---------- */
.ok-badge{width:60px;height:60px;border-radius:50%;background:var(--calma);display:grid;place-items:center;animation:pop .45s var(--ease) backwards}
.ok-badge svg{width:32px;height:32px;color:#fff}
.ok-badge path{stroke-dasharray:24;animation:draw .45s .25s var(--ease) backwards}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes draw{from{stroke-dashoffset:24}}
.kvs{border-radius:14px;background:var(--card);box-shadow:var(--shadow-1);padding:4px 16px;max-width:470px}
.kv{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:10px 0;font-size:14.5px}
.kv+.kv{box-shadow:0 -1px 0 var(--line)}
.kv dt{color:var(--ink-3)}
.kv dd{font-weight:700;min-width:0}
.note-line{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink-2)}
.note-line svg{width:18px;height:18px;flex:none;color:var(--calma);margin-top:1px}

/* ---------- Pantalla: cámaras vinculadas ---------- */
.camaras{padding:24px 40px 0}
.cam-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex:none}
.cam-head .t-meta{display:flex;align-items:center;gap:6px}
.cam-head .t-meta svg{width:16px;height:16px;flex:none}
.health{position:relative;display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow-1);padding:18px 18px 14px;margin-top:18px;overflow:hidden;flex:none}
.health::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--calma)}
.health.idle::before{background:repeating-linear-gradient(135deg,var(--pausa) 0 6px,#8C97AD 6px 12px)}
.health.none::before{background:var(--line-2)}
.health .st{width:44px;height:44px;border-radius:13px}
.health .st svg{width:24px;height:24px}
.health b{display:block;font-size:17px;line-height:1.3}
.health .grow>span{display:block;font-size:14px;color:var(--ink-3)}
.health.warn{background:var(--aviso-soft)}
.health.warn::before{background:repeating-linear-gradient(90deg,var(--aviso) 0 10px,transparent 10px 16px)}
.health.warn b{color:#5E3700}
.health.warn .grow>span{color:#6B4A12}
.health.warn .st{background:#fff}
.health.dark{background:var(--ink);color:#fff}
.health.dark::before{display:none}
.health.dark .grow>span{color:#D4CEE2}
.health.dark .st{background:rgba(255,255,255,.1);color:#FFC76B}
.banner{margin-top:12px;align-items:center;flex:none}
.banner .btn{flex:none}
.cams{list-style:none;margin:12px 0 0;padding:0;background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow-1);overflow:hidden;flex:none}
.cam{display:grid;grid-template-columns:84px minmax(0,1fr) 250px;gap:16px;align-items:center;padding:10px 18px 10px 12px;min-height:72px}
.cam+.cam{box-shadow:0 -1px 0 var(--line)}
.thumb{width:84px;height:52px;border-radius:10px}
.thumb.dim svg{filter:grayscale(1);opacity:.55}
.cam-id b{display:block;font-size:16.5px;line-height:1.3}
.cam-id>span{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cam-id>span svg{width:16px;height:16px;flex:none}
.cam-st{display:flex;align-items:center;gap:12px;min-width:0}
.cam-st b{display:block;font-size:15px;line-height:1.3}
.cam-st .t-meta{display:block}
.st{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.st svg{width:20px;height:20px}
.st.send{background:var(--calma-soft);color:var(--calma-ink)}
.st.pause{background:repeating-linear-gradient(135deg,var(--pausa-soft) 0 5px,#D4D9E4 5px 10px);color:var(--pausa)}
.st.consent{background:var(--aviso-soft);color:var(--aviso)}
.st.off{background:var(--aviso-soft);color:var(--aviso);outline:2px dashed var(--aviso);outline-offset:-2px}
.st.none{background:var(--ground-2);color:var(--ink-3)}
.stx{font-weight:700}
.stx.send{color:var(--calma-ink)}.stx.pause{color:var(--pausa)}.stx.consent,.stx.off{color:var(--aviso)}
.health .st.send svg{animation:lift 1.8s var(--ease) infinite}
@keyframes lift{0%{transform:translateY(3px);opacity:.35}45%,100%{transform:translateY(0);opacity:1}}
.empty-list{margin-top:12px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.empty-list svg{width:30px;height:30px;color:var(--ink-3)}
.empty-list span{font-size:14.5px;color:var(--ink-2)}
.camaras .scr-foot{padding:0 0 18px;margin-top:auto}

/* aviso dentro de la ventana */
.wtoast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:20;background:var(--ink);color:#fff;border-radius:14px;padding:11px 16px 11px 12px;display:flex;gap:10px;align-items:center;
  box-shadow:var(--shadow-2);font-size:14.5px;white-space:nowrap;animation:up .3s var(--ease)}
.wtoast svg{width:20px;height:20px;flex:none}
.wtoast.ok svg{color:#7FD9A8}.wtoast.warn svg{color:#FFC76B}
@keyframes up{from{transform:translate(-50%,16px);opacity:0}}

/* ---------- Celular en miniatura (app Te Tengo) ---------- */
.mphone{width:236px;height:470px;border-radius:40px;background:#17121F;padding:8px;box-shadow:0 22px 34px -18px rgba(0,0,0,.45);flex:none;position:relative}
.ms{width:100%;height:100%;border-radius:32px;background:var(--ground);overflow:hidden;position:relative;display:flex;flex-direction:column;font-size:12.5px;line-height:1.35;color:var(--ink)}
.ms-sb{height:34px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 20px 3px 24px;font-size:11.5px;font-weight:700}
.ms-isl{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:66px;height:19px;border-radius:10px;background:#0B0810}
.ms-ic{display:flex;gap:3px}
.ms-ic svg{width:12px;height:12px}
.ms-bar{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;font-weight:800;font-size:15px}
.ms-bar svg{width:17px;height:17px}
.ms-body{padding:2px 12px;flex:1}
.ms-card{background:#fff;border-radius:16px;box-shadow:var(--shadow-1);padding:12px}
.ms-l{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.ms-chips{display:flex;flex-wrap:wrap;gap:5px}
.ms-chip{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:12px;box-shadow:0 0 0 1.2px var(--line-2) inset}
.ms-chip.sel{background:var(--ink);color:#fff;box-shadow:none}
.ms-hr{height:1px;background:var(--line);margin:12px 0}
.ms-code{font-family:var(--mono);font-size:25px;font-weight:600;letter-spacing:.06em;text-align:center;padding:8px 0;border-radius:10px;background:var(--morado-soft);color:var(--morado-ink)}
.ms-code.exp{background:var(--ground);color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:2px}
.ms-time,.ms-exp{display:flex;align-items:center;justify-content:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--ink-2);margin-top:8px}
.ms-time svg,.ms-exp svg{width:13px;height:13px}
.ms-exp{color:var(--caida-ink)}
.ms-btn{margin-top:8px;background:var(--morado);color:#fff;font-weight:700;font-size:12px;text-align:center;border-radius:10px;padding:8px}
.ms-note{font-size:11.5px;color:var(--ink-3);margin:10px 4px 0}
.ms-list{background:#fff;border-radius:16px;box-shadow:var(--shadow-1);overflow:hidden}
.ms-row{display:flex;gap:9px;align-items:center;padding:9px 10px;position:relative}
.ms-row+.ms-row{box-shadow:0 -1px 0 var(--line)}
.ms-row b{display:block;font-size:13px}
.ms-tile{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--calma-soft);color:var(--calma-ink)}
.ms-tile svg{width:17px;height:17px}
.ms-tile.stop{background:var(--ground-2);color:var(--ink-3)}
.ms-st{display:block;position:relative;font-size:11.5px;color:var(--ink-3);height:16px}
.ms-st>span{position:absolute;left:0;top:0;white-space:nowrap}
.ms-st em{font-style:normal;font-weight:700}
.ms-st em.on{color:var(--calma-ink)}.ms-st em.stop{color:var(--ink-3)}.ms-st em.pend{color:var(--aviso)}
.ms-row.new{animation:flash 1.6s .9s ease-out backwards}
.ms-row.new .was{opacity:0;animation:wasOut 1.4s .2s both}
.ms-row.new .now{animation:nowIn 1.4s .2s both}
.ms-row.new .ms-tile{animation:tileIn .3s 1.1s backwards}
@keyframes wasOut{0%,70%{opacity:1}100%{opacity:0}}
@keyframes nowIn{0%,70%{opacity:0}100%{opacity:1}}
@keyframes tileIn{from{background:var(--aviso-soft);color:var(--aviso)}}
@keyframes flash{from{background:var(--calma-soft)}}
.ms-hello{padding:8px 14px 10px}
.ms-hello span{display:block;font-size:11px;color:var(--ink-3)}
.ms-hello b{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.ms-status{position:relative;overflow:hidden;padding-top:15px}
.ms-status::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--calma)}
.ms-status.warn::before{background:repeating-linear-gradient(90deg,var(--aviso) 0 8px,transparent 8px 13px)}
.ms-who{display:flex;gap:8px;align-items:center}
.ms-who b{display:block;font-size:12.5px}
.ms-who span span{display:block;font-size:11px;color:var(--ink-3)}
.ms-av{width:30px;height:30px;border-radius:50%;background:#F4E4EE;color:#7A2456;font-weight:800;font-size:11.5px;display:grid;place-items:center;flex:none}
.ms-calm{display:flex;align-items:center;gap:7px;margin-top:10px}
.ms-calm svg{width:20px;height:20px;color:var(--calma);flex:none}
.ms-calm b{font-size:15px;font-weight:800}
.ms-status.warn .ms-calm svg{color:var(--aviso)}
.ms-sec{font-size:13px;font-weight:800;margin:14px 2px 7px}
.ms-tile.pend{background:var(--aviso-soft);color:var(--aviso);outline:1.5px dashed var(--aviso);outline-offset:-1.5px}
.ms-tile.paused{background:repeating-linear-gradient(135deg,var(--pausa-soft) 0 4px,#D4D9E4 4px 8px);color:var(--pausa)}
.ms-st em.paused{color:var(--pausa)}
.ms-home{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:84px;height:4px;border-radius:2px;background:var(--ink);opacity:.8}

/* ---------- Escritorio, barra de tareas y bandeja ---------- */
.desk{position:relative;overflow:hidden;background:#D3D5DE;background:radial-gradient(120% 90% at 20% 0%,#E1E2EA 0%,#D3D5DE 55%,#C7CAD5 100%);font-family:var(--font);color:var(--ink)}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:44px;background:#F3F3F6;box-shadow:0 -1px 0 rgba(34,26,56,.12);display:flex;align-items:center;justify-content:center;padding:0 8px;z-index:30}
.tk-mid{display:flex;gap:4px;align-items:center}
.tk-app{width:40px;height:36px;border-radius:6px;display:grid;place-items:center;border:0;background:transparent;color:var(--ink-2);position:relative;padding:0}
.tk-app svg{width:22px;height:22px}
button.tk-app{cursor:pointer}
.tk-app:hover{background:rgba(34,26,56,.07)}
.tk-app.open::after{content:"";position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:16px;height:3px;border-radius:2px;background:var(--morado)}
.tray{position:absolute;right:8px;top:0;bottom:0;display:flex;align-items:center;gap:2px}
.tray-i{height:34px;min-width:30px;border-radius:6px;display:grid;place-items:center;border:0;background:transparent;color:var(--ink);position:relative;padding:0 4px}
.tray-i>svg{width:17px;height:17px}
button.tray-i{cursor:pointer}
.tray-i:hover{background:rgba(34,26,56,.07)}
.tray-app.hl{background:rgba(74,42,133,.12);box-shadow:0 0 0 2px var(--morado) inset}
.tdot{position:absolute;right:3px;bottom:5px;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 2px #F3F3F6;background:var(--calma)}
.tdot.warn{background:#D98A00}.tdot.idle{background:#8C849E}
.tk-clock{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;line-height:1.3;padding:0 8px 0 10px;font-variant-numeric:tabular-nums}
.os-toast{position:absolute;right:12px;bottom:56px;width:372px;background:#FCFCFD;border-radius:10px;box-shadow:0 0 0 1px rgba(34,26,56,.1),0 16px 36px -12px rgba(23,18,31,.35);padding:12px 16px 16px;z-index:31;animation:toastIn .35s var(--ease)}
.os-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);margin-bottom:10px}
.os-h .os-t{flex:1}
.os-x{width:28px;height:28px;border-radius:6px;border:0;background:transparent;color:var(--ink-2);display:grid;place-items:center;cursor:pointer;margin:-4px -8px -4px 0}
.os-x:hover{background:rgba(34,26,56,.07)}
.os-x svg{width:15px;height:15px}
.os-toast b{display:block;font-size:15px;line-height:1.3}
.os-toast p{font-size:13.5px;color:var(--ink-2);margin-top:4px;line-height:1.4}
@keyframes toastIn{from{transform:translateX(24px);opacity:0}}
.desk.corner{width:960px;height:640px;border-radius:var(--r-win);box-shadow:0 0 0 1px rgba(34,26,56,.16)}

/* sin animación: exportaciones estáticas */
.static *,.static *::before,.static *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- Arranque: ventana de inicio centrada sobre el escritorio ---------- */
.boot{position:absolute;left:50%;top:calc(50% - 22px);width:480px;height:300px;margin:-150px 0 0 -240px;border-radius:var(--r-win);background:var(--morado);color:#fff;
  display:flex;flex-direction:column;align-items:center;padding:40px 32px 22px;z-index:20;font-family:var(--font);
  box-shadow:0 0 0 1px rgba(23,18,31,.2),0 28px 56px -20px rgba(23,18,31,.55),0 6px 14px rgba(23,18,31,.14)}
.boot-mark{width:84px;height:84px}
.boot .sp-mark{display:block;width:84px;height:84px;overflow:visible}
.boot .boot-wm{display:block;width:250px;height:auto;margin-top:22px}
.boot-foot{margin-top:auto;width:100%}
.boot-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}
.boot-bar i{display:block;height:100%;border-radius:2px;background:#fff;transform-origin:left center;transition:transform .55s var(--ease)}
.boot-st{display:flex;justify-content:space-between;gap:16px;margin-top:10px;font-size:13px;line-height:1.3;color:#E4DAF4}
.boot-v{font-size:12.5px;font-variant-numeric:tabular-nums;color:rgba(228,218,244,.8)}
.boot.play{animation:bootIn .3s var(--ease) both}
.boot.out{animation:bootOut .2s ease-in forwards}
.boot.play .sp-arm{stroke-dasharray:1 1;animation:spDraw .42s cubic-bezier(.3,.7,.3,1) .12s both}
.boot.play .sp-dot{animation:spDrop .42s cubic-bezier(.55,0,.85,.35) .38s both}
.boot.play .sp-catch{animation:spCatch .42s .8s both}
.boot.play .sp-stem{stroke-dasharray:1 1;animation:spDraw .32s cubic-bezier(.3,.7,.3,1) .98s both}
.boot.play .boot-wm{animation:spUp .45s var(--ease) 1.05s both}
@keyframes bootIn{from{opacity:0;transform:scale(.97)}}
@keyframes bootOut{to{opacity:0;transform:scale(.98)}}
@keyframes spDraw{0%{stroke-dashoffset:1;opacity:0}10%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
@keyframes spDrop{0%{transform:translateY(-70px);opacity:0}30%{opacity:1}100%{transform:none;opacity:1}}
@keyframes spCatch{0%{transform:none;animation-timing-function:cubic-bezier(.2,.7,.4,1)}32%{transform:translateY(5px);animation-timing-function:cubic-bezier(.4,0,.2,1)}100%{transform:none}}
@keyframes spUp{from{opacity:0;transform:translateY(8px)}}


/* ---------- Prueba piloto: ventana de estado de una sola cámara, configurada por el equipo ---------- */
.estado{padding:24px 40px 0}
.health.lost::before{background:repeating-linear-gradient(90deg,var(--aviso) 0 10px,transparent 10px 16px)}
.health .btn{flex:none}
.est-grid{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:16px;margin-top:14px;flex:none}
.est-cam{padding:14px;display:flex;flex-direction:column;gap:14px}
.est-cam .thumb{width:100%;height:150px;border-radius:12px}
.est-cam-b .grp-l{margin:0 0 2px}
.est-cam-b .t-h2{font-size:22px}
.cam-dev{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-3);margin-top:2px}
.cam-dev svg{width:16px;height:16px;flex:none}
.est-cam .cam-st{margin-top:12px}
.est-conf{padding:18px 20px 16px;display:flex;flex-direction:column}
.conf-h{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:800;margin:0 0 6px}
.conf-h svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.conf-kv{margin:0}
.conf-kv>div{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:9px 0;font-size:14.5px}
.conf-kv>div+div{box-shadow:0 -1px 0 var(--line)}
.conf-kv dt{color:var(--ink-3)}
.conf-kv dd{font-weight:700;min-width:0}
.conf-kv dd span{display:block;font-weight:400;font-size:13px;color:var(--ink-3)}
.conf-note{display:flex;gap:8px;align-items:flex-start;margin-top:auto;padding-top:10px;font-size:13px;line-height:1.4;color:var(--ink-3)}
.conf-note svg{width:16px;height:16px;flex:none;margin-top:1px}
.estado .scr-foot{padding:0 0 18px;margin-top:auto}
.os-toast.warn b{display:flex;align-items:center;gap:8px;color:#5E3700}
.os-toast.warn b svg{width:18px;height:18px;color:var(--aviso);flex:none}
.g-note{display:flex;gap:10px;align-items:flex-start;max-width:80ch;margin:-8px 0 26px;padding:12px 16px;border-radius:14px;background:#fff;box-shadow:0 0 0 1.5px var(--line-2) inset;font-size:15.5px;line-height:1.45;color:var(--ink-2)}
.g-note svg{width:20px;height:20px;flex:none;color:var(--morado-ink);margin-top:2px}
.g-sec.futuro>h2{border-bottom-style:dashed}

html,body{margin:0;height:100%}
body.proto{background:#E6E4EC;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
.stage{height:100vh;display:flex;align-items:center;justify-content:center;gap:24px;padding:20px}
.fit{flex:none}
#desk{width:1120px;height:760px;border-radius:14px;box-shadow:0 0 0 1px rgba(34,26,56,.12),0 18px 40px -20px rgba(23,18,31,.4)}
.win-slot{position:absolute;left:80px;top:34px;transition:opacity .2s ease-out,transform .28s var(--ease),visibility 0s linear 0s}
.win-slot.hidden{opacity:0;transform:translateY(28px) scale(.96);pointer-events:none;visibility:hidden;transition:opacity .18s ease-in,transform .22s ease-in,visibility 0s linear .22s}
#scr-h:focus{outline:none}

/* ---------- panel de demostración (fuera de la app) ---------- */
.dp{width:320px;flex:none;display:flex;flex-direction:column;background:var(--card);color:var(--ink);border-radius:20px;box-shadow:0 0 0 1px rgba(34,26,56,.07),0 10px 30px -14px rgba(34,26,56,.28);font-size:14px;line-height:1.35;max-height:calc(100vh - 80px);position:sticky;top:40px;overflow:hidden}
.dp ::selection{background:var(--morado-soft);color:var(--morado-ink)}
.dp-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:18px 16px 6px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.dp-head h2{font-size:16px;font-weight:800;margin:0;letter-spacing:-.005em;color:var(--ink);text-transform:none}
.dp-head p{font-size:13px;line-height:1.4;color:var(--ink-3);margin:3px 0 0}
.dp-status{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.25fr);gap:1px;margin:14px 0 0;border-radius:14px;overflow:hidden;background:var(--line)}
.dp-status>div{background:var(--ground);padding:7px 10px;min-width:0}
.dp-status dt{font-size:11.5px;font-weight:600;color:var(--ink-3);margin:0}
.dp-status dd{margin:1px 0 0;font-size:13.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;min-width:0}
.dp-status dd.mono{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.dp-status .wide{grid-column:1/-1}
.dp-dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--calma)}
.dp-dot.caida{background:var(--caida)}.dp-dot.inestable{background:var(--inestable-deep,#D99A12);border-radius:2px;transform:rotate(45deg)}.dp-dot.warn{background:var(--aviso)}.dp-dot.idle{background:var(--pausa)}
.dp-log{margin:8px 0 0;min-height:38px;font-size:13.5px;line-height:1.4;color:var(--morado-ink);padding:8px 12px;border-radius:12px;background:var(--morado-soft)}
.dp-log.flash{animation:dpfl .6s ease-out}
@keyframes dpfl{from{background:#D9CEEF}}
.dp-secs{margin-top:10px}
.dp-sec{border-top:1px solid var(--line)}
.dp-sec h3{margin:0;font-size:inherit}
.dp-sec-h{appearance:none;border:0;background:none;font:inherit;display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:8px 4px;margin:2px 0;cursor:pointer;font-size:14.5px;font-weight:800;color:var(--ink);text-align:left;border-radius:10px}
.dp-sec-h:hover{background:var(--ground)}
.dp-sec-i{width:28px;height:28px;border-radius:9px;background:var(--morado-soft);color:var(--morado);display:grid;place-items:center;flex:none}
.dp-sec-i svg{width:17px;height:17px}
.dp-sec-t{flex:1}
.dp-sec-h .dp-chev{width:18px;height:18px;flex:none;color:var(--ink-3);transform:rotate(90deg);transition:transform .2s var(--ease)}
.dp-sec-h[aria-expanded=false] .dp-chev{transform:none}
.dp-sec-b{display:flex;flex-direction:column;gap:6px;padding:0 0 14px}
.dp-sec-b[hidden]{display:none}
.dp-note{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);margin:0 0 2px;padding:0 2px}
.dp-note b{color:var(--ink)}
.dp-sub{font-size:12px;font-weight:700;color:var(--ink-3);margin:8px 2px 0}
.dp-row{position:relative;display:flex;gap:4px;align-items:stretch}
.dp-b{flex:1;min-width:0;appearance:none;border:0;background:var(--ground);color:var(--ink);font:inherit;font-size:14px;font-weight:600;line-height:1.3;text-align:left;padding:8px 12px;border-radius:11px;cursor:pointer;min-height:42px;display:flex;align-items:center;gap:10px;transition:background .15s,color .15s,box-shadow .15s}
.dp-b:hover{background:var(--morado-soft);color:var(--morado-ink)}
.dp-b:active{transform:scale(.99)}
.dp-b .dp-lbl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dp-b .dp-why{font-size:12.5px;font-weight:500;color:var(--ink-3);line-height:1.3}
.dp-b .dp-why:empty{display:none}
.dp-b[aria-disabled=true]{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-3);cursor:not-allowed}
.dp-b[aria-disabled=true]:hover{background:transparent;color:var(--ink-3)}
.dp-b[aria-disabled=true]:active{transform:none}
.dp-sw{flex:none;width:34px;height:20px;border-radius:10px;background:var(--line-2);position:relative;transition:background .2s}
.dp-sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.dp-b[aria-pressed=true]{background:var(--morado-soft);color:var(--morado-ink)}
.dp-b[aria-pressed=true] .dp-sw{background:var(--morado)}
.dp-b[aria-pressed=true] .dp-sw::after{transform:translateX(14px)}
.dp-i{flex:none;width:36px;min-height:42px;appearance:none;border:0;border-radius:11px;background:transparent;color:var(--ink-3);display:grid;place-items:center;cursor:help;padding:0}
.dp-i svg{width:19px;height:19px}
.dp-i:hover,.dp-row.tip-open .dp-i{background:var(--ground);color:var(--morado)}
.dp-tip{position:absolute;z-index:30;right:0;top:calc(100% + 7px);width:min(276px,100%);background:#221A38;color:#fff;font-size:13px;line-height:1.45;font-weight:500;text-align:left;padding:10px 12px 11px;border-radius:12px;box-shadow:0 10px 28px rgba(23,18,31,.28),0 2px 6px rgba(23,18,31,.16);opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .12s,transform .12s,visibility 0s linear .12s;pointer-events:none}
.dp-tip::before{content:"";position:absolute;top:-5px;right:13px;width:10px;height:10px;background:#221A38;transform:rotate(45deg);border-radius:2px}
.dp-tip b{display:block;font-weight:700;margin-bottom:3px}
.dp-tip .dp-tip-why{display:block;margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.18);color:#F7CE7A;font-weight:600}
.dp-tip .dp-tip-why:empty{display:none}
.dp-tip.up{top:auto;bottom:calc(100% + 7px);transform:translateY(4px)}
.dp-tip.up::before{top:auto;bottom:-5px}
.dp-row.tip-open .dp-tip{opacity:1;visibility:visible;transform:none;transition:opacity .15s,transform .2s var(--ease),visibility 0s}
.dp-creds{margin:4px 0 2px;padding:9px 11px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);font-size:12.5px;color:var(--ink-2)}
.dp-creds p{margin:0 0 5px;font-weight:700;color:var(--ink-3);font-size:12px}
.dp-creds dl{margin:0;display:grid;gap:6px}
.dp-creds dl>div{display:grid;grid-template-columns:62px 1fr;gap:0 8px}
.dp-creds dt{font-weight:700;color:var(--ink)}
.dp-creds dd{margin:0;font-family:var(--mono);font-size:12px;line-height:1.45;overflow-wrap:anywhere;user-select:all}
.dp-foot{border-top:1px solid var(--line);padding:10px 16px 14px;background:var(--card)}
.dp-foot .dp-b{justify-content:center;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2);font-weight:700}
.dp-foot .dp-b:hover{background:var(--ground);color:var(--ink)}
.dp-foot .dp-b .dp-lbl{flex:none}
.dp-b>svg{width:18px;height:18px;flex:none}
.dp-hint{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.4;color:var(--ink-3);margin:2px 0 12px;padding:0 2px}
.dp-hint svg{width:16px;height:16px;flex:none;margin-top:1px;color:var(--morado)}
.dp :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.dp-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.dp *,.dp *::after{transition:none!important;animation:none!important}}
.dp{position:relative;top:auto;max-height:calc(100vh - 40px)}
@media (max-width:900px){.stage{flex-direction:column;overflow:auto;height:auto;min-height:100vh;justify-content:flex-start;padding:16px 12px 32px}body.proto{overflow:auto}.dp{width:100%;max-width:560px;max-height:none;overflow:visible}.dp-scroll{overflow:visible}}

/* aviso del sistema: al cerrar o minimizar la ventana (kind 'closed') o si la webcam se desconecta con la ventana cerrada (kind 'lost') */
function osToast(S, kind){
  let t, sub;
  if(kind==='lost'){ t='La webcam se desconectó'; sub='Revisa que el cable USB de la '+CONF.webcam+' esté bien conectado. Mientras tanto no se envía video.'; }
  else { t='Te Tengo Captura sigue funcionando en segundo plano';
    if(S.lost) sub='La webcam está desconectada: revisa el cable USB. Ábrelo desde su ícono, junto al reloj.';
    else if(!S.online) sub='Seguirá intentando conectarse a internet. Ábrelo desde su ícono, junto al reloj.';
    else if(!S.consent) sub='Empezará a enviar cuando la familia complete el consentimiento en la app Te Tengo.';
    else if(S.pause) sub='La cámara está en pausa hasta las '+S.pause+'. Ábrelo desde su ícono, junto al reloj.';
    else sub='Sigue enviando el video de la cámara. Ábrelo desde su ícono, junto al reloj.'; }
  return '<div class="os-toast'+(kind==='lost'?' warn':'')+'" role="status"><div class="os-h">'+appIcon('xs')+'<span class="os-t">Te Tengo Captura</span><button class="os-x" data-act="toastClose" aria-label="Cerrar aviso">'+ic('x')+'</button></div>'+
    '<b>'+(kind==='lost'?ic('videoOff'):'')+t+'</b><p>'+sub+'</p></div>';
}
function desktopCorner(S, kind){ return '<div class="desk corner" aria-label="Escritorio de Windows">'+taskbar(S,{hl:true})+osToast(S, kind)+'</div>'; }

if(typeof module!=='undefined') module.exports = {PRESETS, renderPreset, win, baseState, logotipo};

/* ================= Te Tengo Captura · prototipo navegable (prueba piloto) =================
   Arranque → ventana de estado de la única webcam, configurada por el equipo del proyecto →
   minimizar o cerrar a la bandeja (ícono con punto de estado y aviso del sistema). Sin vinculación de cámaras. */
(function(){
  'use strict';
  const $ = id => document.getElementById(id);

  let S, closed, osKind, enterCls, toastTimer, osTimer, booting = false, bootTimers = [], rescanT = null;
  function init(){
    S = baseState();
    closed = false; osKind = null; enterCls = '';
    clearTimeout(toastTimer); clearTimeout(osTimer); clearTimeout(rescanT);
  }

  /* ---------- render con foco preservado ---------- */
  function snap(){
    const a = document.activeElement;
    if(!a || a===document.body || !$('winslot').contains(a) && !$('tbwrap').contains(a)) return null;
    return {id:a.id, act:a.dataset && a.dataset.act};
  }
  function restore(f){
    if(!f) return;
    let el = f.id ? $(f.id) : null;
    if(!el && f.act) el = document.querySelector('#winslot [data-act="'+f.act+'"]');
    if(el && !el.disabled) el.focus({preventScroll:true});
  }
  function render(focusScreen){
    const f = focusScreen ? null : snap();
    const slot = $('winslot');
    slot.innerHTML = win(S, {enter:enterCls});
    enterCls = '';
    slot.classList.toggle('hidden', closed || booting);
    slot.setAttribute('aria-hidden', closed || booting ? 'true' : 'false');
    $('tbwrap').innerHTML = taskbar(S, {open:!closed, hl:!!osKind});
    $('ostoast').innerHTML = osKind ? osToast(S, osKind) : '';
    renderDemo();
    if(focusScreen && !closed && !booting){ const t = $('scr-h'); if(t) t.focus({preventScroll:true}); }
    else restore(f);
  }
  function toast(kind, icon, text){
    S.toast = {kind, icon, text}; render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ S.toast = null; render(); }, 3800);
  }
  function osNotify(kind){
    osKind = kind; render();
    clearTimeout(osTimer); osTimer = setTimeout(()=>{ osKind = null; render(); }, 8000);
  }

  /* ---------- arranque: ventana de inicio y luego la ventana de estado ---------- */
  function boot(){
    bootTimers.forEach(clearTimeout); bootTimers = [];
    booting = true; render();
    const bs = $('bootslot');
    bs.innerHTML = bootWin({play:true, pct:0, step:0});
    const bar = bs.querySelector('.boot-bar'), fill = bar.querySelector('i'), txt = $('boot-st');
    const at = (ms, fn) => bootTimers.push(setTimeout(fn, ms));
    const set = (p, k) => { fill.style.transform = 'scaleX('+(p/100)+')'; bar.setAttribute('aria-valuenow', p); if(k!=null) txt.textContent = BOOT_STEPS[k]; };
    at(80, ()=>set(22));
    at(720, ()=>set(54, 1));
    at(1340, ()=>set(86, 2));
    at(1820, ()=>set(100));
    at(2060, ()=>{ const b = bs.querySelector('.boot'); if(b) b.classList.add('out'); });
    at(2240, ()=>{ bs.innerHTML = ''; booting = false; enterCls = 'enter'; render(true); });
  }

  /* ---------- ventana y bandeja ---------- */
  function hideWindow(){ closed = true; osNotify('closed'); }
  function openWindow(){ closed = false; osKind = null; clearTimeout(osTimer); render(true); }

  /* ---------- acciones de la interfaz ---------- */
  const ACT = {
    retryNow(){ S.retry = 10; toast('warn','wifiOff','Aún sin internet. Seguimos intentando.'); },
    rescan(){
      const b = document.querySelector('#winslot [data-act="rescan"]'); if(b){ b.classList.add('loading'); b.innerHTML = '<span class="spin"></span>Buscando…'; }
      clearTimeout(rescanT); rescanT = setTimeout(()=>{ toast('warn','videoOff','No encontramos la webcam. Revisa el cable USB y vuelve a intentarlo.'); }, 900);
    },
    minimize: hideWindow, close: hideWindow,
    trayOpen: openWindow,
    toastClose(){ osKind = null; clearTimeout(osTimer); render(); }
  };
  document.addEventListener('click', e=>{
    const t = e.target.closest('[data-act]');
    if(t && ACT[t.dataset.act] && !t.disabled && t.getAttribute('aria-disabled')!=='true'){ e.preventDefault(); ACT[t.dataset.act](t.dataset.arg); return; }
    const d = e.target.closest('[data-demo]');
    if(d && !d.disabled) DEMO[d.dataset.demo]();
  });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && osKind){ ACT.toastClose(); } });

  /* ---------- panel de demostración: lo que pasa fuera de la ventana ---------- */
  const DEMO = {
    pause(){
      S.pause = S.pause ? null : '15:00';
      if(closed) return render();
      if(S.pause) toast('ok','pause','La familia pausó la cámara desde la app Te Tengo hasta las 15:00.');
      else toast('ok','upload','La pausa terminó: el envío se reanudó.');
    },
    consent(){
      S.consent = !S.consent;
      if(closed) return render();
      if(S.consent) toast('ok','check','Consentimiento registrado en la app Te Tengo. Empezó el envío.');
      else render();
    },
    net(){
      S.online = !S.online; S.retry = 8;
      if(closed) return render();
      if(S.online) toast('ok','check','Conexión restablecida. El envío se reanudó.');
      else render();
    },
    usb(){
      S.lost = !S.lost; clearTimeout(rescanT);
      if(S.lost){ if(closed) osNotify('lost'); else render(); }
      else { if(closed) render(); else toast('ok','usb','Se volvió a conectar la '+CONF.webcam+'. El envío se reanudó.'); }
    },
    rename(){
      S.room = S.room==='Sala' ? 'Sala comedor' : 'Sala';
      if(closed) return render();
      toast('ok','check','La familia cambió el nombre de la habitación en la app: «'+S.room+'».');
    },
    reset(){ init(); boot(); }
  };
  /* ---------- panel de demostración: secciones plegables y ayudas «i» ---------- */
  const DP = {
    tipText: c => c.tip[0] + ' ' + c.tip[1],
    /* una fila: acción + botón «i» con su ayuda (role=tooltip, también como title nativo) */
    row(key, c, extra){
      const tid = 'dp-tip-' + key, wid = 'dp-why-' + key;
      return '<div class="dp-row"><button type="button" class="dp-b" data-demo="' + key + '" aria-describedby="' + wid + ' ' + tid + '" title="' + esc(DP.tipText(c)) + '"' + (c.sw ? ' aria-pressed="false"' : '') + '>' +
        (c.icon ? ic(c.icon) : '') + '<span class="dp-lbl"><span class="dp-l">' + c.l + '</span><span class="dp-why" id="' + wid + '"></span></span>' + (c.sw ? '<span class="dp-sw" aria-hidden="true"></span>' : '') + '</button>' +
        '<button type="button" class="dp-i" data-tip="' + key + '" aria-label="Qué hace: ' + esc(c.l) + '" aria-describedby="' + tid + '">' + ic('info') + '</button>' +
        '<span class="dp-tip" role="tooltip" id="' + tid + '"><b>' + c.tip[0] + '</b>' + c.tip[1] + '<span class="dp-tip-why"></span></span></div>' + (extra || '');
    },
    section(s, body){
      const bid = 'dp-b-' + s.id;
      return '<section class="dp-sec"><h3><button type="button" class="dp-sec-h" data-sec="' + s.id + '" aria-expanded="' + (s.open !== false) + '" aria-controls="' + bid + '">' +
        '<span class="dp-sec-i">' + ic(s.icon) + '</span><span class="dp-sec-t">' + s.t + '</span>' + ic('chevR', 'class="dp-chev"') + '</button></h3>' +
        '<div class="dp-sec-b" id="' + bid + '"' + (s.open === false ? ' hidden' : '') + '>' + body + '</div></section>';
    },
    /* activa o desactiva una acción y explica por qué */
    disable(root, key, why, c){
      const b = root.querySelector('[data-demo="' + key + '"]'); if(!b) return;
      b.setAttribute('aria-disabled', why ? 'true' : 'false');
      const w = b.querySelector('.dp-why'); if(w.textContent !== (why || '')) w.textContent = why || '';
      const row = b.closest('.dp-row'), tw = row.querySelector('.dp-tip-why');
      tw.textContent = why ? 'Ahora no está disponible: ' + why : '';
      b.title = (why ? 'Ahora no está disponible: ' + why + ' ' : '') + DP.tipText(c);
    },
    init(root, store){
      let saved = {};
      try { saved = JSON.parse(sessionStorage.getItem(store) || '{}') || {}; } catch(e) {}
      const setSec = (h, open) => { h.setAttribute('aria-expanded', open); const b = document.getElementById(h.getAttribute('aria-controls')); if(b) b.hidden = !open; };
      root.querySelectorAll('.dp-sec-h').forEach(h => {
        const id = h.dataset.sec; if(id in saved) setSec(h, !!saved[id]);
        h.addEventListener('click', () => { const open = h.getAttribute('aria-expanded') !== 'true'; setSec(h, open); saved[id] = open; try { sessionStorage.setItem(store, JSON.stringify(saved)); } catch(e) {} });
      });
      /* ayudas: se abren con el cursor encima, con el foco del teclado o con un toque (que las fija) */
      const ST = new WeakMap();
      const get = r => { let s = ST.get(r); if(!s){ s = {}; ST.set(r, s); } return s; };
      const place = row => {
        const tip = row.querySelector('.dp-tip'); tip.classList.remove('up');
        const sc = row.closest('.dp-scroll'), r = row.getBoundingClientRect(), h = tip.offsetHeight + 12;
        const top = sc ? Math.max(0, sc.getBoundingClientRect().top) : 0, bottom = Math.min(window.innerHeight, sc ? sc.getBoundingClientRect().bottom : window.innerHeight);
        if(r.bottom + h > bottom && r.top - h >= top) tip.classList.add('up');
      };
      const closeAll = except => root.querySelectorAll('.dp-row.tip-open').forEach(r => { if(r !== except){ ST.set(r, {}); r.classList.remove('tip-open'); } });
      const upd = row => { const s = get(row), on = !!(s.hover || s.focus || s.pin); if(on){ closeAll(row); place(row); } row.classList.toggle('tip-open', on); };
      root.addEventListener('pointerover', e => { const b = e.target.closest('.dp-i'); if(b && e.pointerType === 'mouse'){ const r = b.closest('.dp-row'); get(r).hover = true; upd(r); } });
      root.addEventListener('pointerout', e => { const b = e.target.closest('.dp-i'); if(b && e.pointerType === 'mouse' && !b.contains(e.relatedTarget)){ const r = b.closest('.dp-row'); get(r).hover = false; upd(r); } });
      root.addEventListener('focusin', e => { const b = e.target.closest('.dp-i'); if(b && b.matches(':focus-visible')){ const r = b.closest('.dp-row'); get(r).focus = true; upd(r); } });
      root.addEventListener('focusout', e => { const b = e.target.closest('.dp-i'); if(b){ const r = b.closest('.dp-row'); ST.set(r, {}); upd(r); } });
      root.addEventListener('click', e => { const b = e.target.closest('.dp-i'); if(!b) return; const r = b.closest('.dp-row'), s = get(r);
        if(s.pin){ ST.set(r, {}); } else s.pin = true; upd(r); });
      document.addEventListener('click', e => { if(!e.target.closest || !e.target.closest('.dp-i')) closeAll(null); });
      document.addEventListener('keydown', e => { if(e.key === 'Escape' && root.querySelector('.dp-row.tip-open')){ closeAll(null); } });
      const sc = root.querySelector('.dp-scroll'); if(sc) sc.addEventListener('scroll', () => closeAll(null), {passive: true});
    }
  };

  const CTRL = {
    net: {l:'Sin internet en la casa', sw:true, tip:['Se corta la conexión a internet de la PC.', 'La ventana muestra «Sin internet, reintentando» con una cuenta regresiva y el punto de la bandeja pasa a ámbar. Vuelve a tocar para restablecerla.']},
    usb: {l:'Webcam USB desconectada', sw:true, tip:['Se suelta el cable USB de la webcam.', 'La ventana pide revisar el cable y ofrece «Buscar de nuevo». Con la ventana cerrada, aparece un aviso de Windows junto al reloj.']},
    pause: {l:'Cámara en pausa hasta las 15:00', sw:true, tip:['Un familiar pausa la cámara desde la app Te Tengo.', 'La ventana muestra «En pausa» con la hora en que se reanuda, no se envía video y el punto de la bandeja pasa a gris.']},
    consent: {l:'Falta el consentimiento', sw:true, tip:['El consentimiento de Rosa todavía no está registrado en la app.', 'La webcam no envía video y la ventana explica que se espera el consentimiento. Al registrarlo, el envío empieza solo.']},
    rename: {l:'Habitación renombrada a «Sala comedor»', sw:true, tip:['Carmen cambia el nombre de la habitación en la app.', 'La ventana muestra el nombre nuevo en la cámara y en la configuración. Vuelve a tocar para llamarla «Sala» otra vez.']},
    reset: {l:'Reiniciar la demo', icon:'refresh', tip:['Vuelve todo al estado inicial.', 'Se repite la ventana de arranque y luego la cámara aparece enviando video.']}
  };
  const PANEL = [
    {id:'pc', t:'Estado de la PC', icon:'monitor', items:['net', 'usb']},
    {id:'app', t:'Desde la app Te Tengo', icon:'mobile', items:['pause', 'consent', 'rename']}
  ];
  (function buildPanel(){
    const root = $('demo');
    root.innerHTML = '<div class="dp-scroll"><header class="dp-head"><h2 id="dp-h">Panel de demostración</h2><p>Simula lo que pasa fuera de esta ventana: la PC, la webcam y la app de la familia.</p></header>' +
      '<dl class="dp-status" aria-label="Estado de la demostración"><div><dt>Hora</dt><dd class="mono">10:42</dd></div><div><dt>Ventana</dt><dd id="dp-win">Iniciando</dd></div>' +
      '<div class="wide"><dt>Bandeja</dt><dd id="dp-tray"><i class="dp-dot" aria-hidden="true"></i><span>Enviando video</span></dd></div></dl>' +
      '<div class="dp-secs">' + PANEL.map(s => DP.section(s, s.items.map(k => DP.row(k, CTRL[k])).join(''))).join('') + '</div>' +
      '<p class="dp-hint">' + ic('info') + '<span>Cierra o minimiza la ventana: el programa sigue en la bandeja, junto al reloj. Toca su ícono para abrirla otra vez. Si desconectas la webcam con la ventana cerrada, aparece un aviso de Windows.</span></p></div>' +
      '<div class="dp-foot">' + DP.row('reset', CTRL.reset) + '</div>';
    DP.init(root, 'tt-demo-escritorio');
  })();
  function renderDemo(){
    const set = (k, on) => { const b = document.querySelector('#demo [data-demo="' + k + '"]'); if(b) b.setAttribute('aria-pressed', !!on); };
    set('pause', !!S.pause); set('consent', !S.consent); set('net', !S.online); set('usb', S.lost); set('rename', S.room !== 'Sala');
    const t = trayState(S);
    $('dp-win').textContent = booting ? 'Iniciando' : closed ? 'En la bandeja' : 'Abierta';
    const v = '<i class="dp-dot ' + t.k + '" aria-hidden="true"></i><span>' + esc(t.label.charAt(0).toUpperCase() + t.label.slice(1)) + '</span>';
    if($('dp-tray').innerHTML !== v) $('dp-tray').innerHTML = v;
  }

  /* ---------- cuenta regresiva de reconexión ---------- */
  setInterval(()=>{
    if(S.online) return;
    S.retry = S.retry<=1 ? 10 : S.retry-1;
    const r = $('retry'); if(r) r.textContent = S.retry;
  }, 1000);

  /* ---------- escala del escritorio ---------- */
  function fit(){
    const narrow = window.innerWidth <= 900;
    const availW = narrow ? window.innerWidth - 40 : window.innerWidth - 40 - 24 - 320;
    const availH = narrow ? Infinity : window.innerHeight - 40;
    const s = Math.min(1, availW/1120, availH/760);
    $('fit').style.zoom = s;
  }
  window.addEventListener('resize', fit);

  init(); fit(); boot();
})();

</script>
</body>
