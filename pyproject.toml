[project]
name = "te-tengo-desktop-pywebview"
version = "0.4.3"
description = "Te Tengo Captura: household agent that captures the webcam, estimates pose and classifies falls on the PC."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Jhosepmyr Orlando Gutierrez Soto" },
    { name = "Elmer Augusto Riva Rodriguez" },
]
dependencies = [
    "httpx>=0.28",
    # Pinned: 1.0.x fails on macOS (issue google-ai-edge/mediapipe#6356). See docs/adr/0003.
    "mediapipe==0.10.35",
    "numpy>=2.0",
    "pydantic>=2.13",
    "platformdirs>=4",
    "av>=18.1.0",
    "pywebview>=6.2.1",
    "pystray>=0.19.5",
    "pillow>=12.3.0",
    "websockets>=15",
]

[project.scripts]
te-tengo-captura = "te_tengo_captura.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.16",
]
empaquetado = [
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/te_tengo_deteccion", "src/te_tengo_captura"]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "ASYNC", "RUF", "PT"]
# RUF001-003: identifiers and UI strings are Spanish (accents, «θ», dashes).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests compare the Spanish copy verbatim; splitting it would hide what is asserted.
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["te_tengo_deteccion", "te_tengo_captura"]

# ---------------------------------------------------------------- Mypy
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mediapipe.*", "cv2.*", "pystray.*", "PyObjCTools.*", "AppKit.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=te_tengo_deteccion --cov=te_tengo_captura --cov-report=term-missing"
markers = [
    "integracion: requires the downloaded MediaPipe model",
    "docker: runs a container (MediaMTX); skipped when Docker is not available",
]

[tool.coverage.run]
branch = true
source = ["te_tengo_deteccion", "te_tengo_captura"]
