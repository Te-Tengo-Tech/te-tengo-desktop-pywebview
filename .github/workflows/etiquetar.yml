name: Etiquetar

# A release merged into main (docs/RELEASES.md). Nothing is built or deployed here: release.yml already
# published the binaries from the release branch after the staging and produccion approvals.
#   1. Tag v<version> (pyproject.toml, which must match __version__) on this commit and publish the
#      GitHub Release with the CHANGELOG section of that version as notes. When release.yml left a
#      draft v<version> with the installer and the disk image (switch ENABLE_DESKTOP_GITHUB_RELEASE),
#      that draft is published, so the attached binaries are exactly the approved ones; it is only
#      accepted when it was built from the same tree as this commit. Skipped when the tag exists.
#   2. Open the back-merge pull request main → develop.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: etiquetar
  cancel-in-progress: false

jobs:
  etiquetar:
    name: Tag and GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      ENABLE_DESKTOP_GITHUB_RELEASE: ${{ vars.ENABLE_DESKTOP_GITHUB_RELEASE }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/te_tengo_captura/__init__.py)
          proyecto=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1)
          if [ "$version" != "$proyecto" ]; then
            echo "::error title=Version mismatch::__version__ $version (src/te_tengo_captura/__init__.py) does not match pyproject.toml version $proyecto"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release notes from the CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The lines between "## [<version>]" and the next "## [" heading.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { dentro = 1; next }
            dentro && /^## \[/ { exit }
            dentro { print }
          ' CHANGELOG.md > notas.md
          if ! grep -q '[^[:space:]]' notas.md; then
            echo "::warning title=No CHANGELOG section::CHANGELOG.md has no '## [$VERSION]' section; the release notes point to the CHANGELOG."
            echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/CHANGELOG.md)." > notas.md
          fi
          cat notas.md
      - name: Tag and publish the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          titulo="Te Tengo Captura $VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::notice title=Tag $tag exists::Nothing to tag: $tag was already released."
            echo "Tag \`$tag\` already exists: nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if datos=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish 2> /dev/null) \
            && [ "$(jq -r .isDraft <<< "$datos")" = true ]; then
            # The draft of release.yml: check that its binaries were built from this tree.
            origen=$(jq -r .targetCommitish <<< "$datos")
            git cat-file -e "$origen^{commit}" 2> /dev/null || git fetch --quiet origin "$origen"
            if [ "$(git rev-parse "$origen^{tree}")" != "$(git rev-parse "HEAD^{tree}")" ]; then
              echo "::error title=Draft built from other files::The draft $tag was built from $origen, whose files differ from main ($GITHUB_SHA). Push the release branch again so release.yml rebuilds it, or delete the draft to release without binaries."
              exit 1
            fi
            # Publishing the draft creates the tag on this commit.
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --target "$GITHUB_SHA" \
              --title "$titulo" --notes-file notas.md --latest
            assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | join(", ")')
            echo "Published \`$tag\` on \`${GITHUB_SHA:0:12}\` with the approved binaries: $assets" >> "$GITHUB_STEP_SUMMARY"
          else
            if [ "$ENABLE_DESKTOP_GITHUB_RELEASE" = true ]; then
              echo "::warning title=No binaries attached::ENABLE_DESKTOP_GITHUB_RELEASE is 'true' but release.yml left no draft $tag (its produccion job did not run or the switch was off then). The release is created without binaries."
            fi
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$titulo" --notes-file notas.md --latest
            echo "Created \`$tag\` on \`${GITHUB_SHA:0:12}\` without binaries." >> "$GITHUB_STEP_SUMMARY"
          fi

  back-merge:
    name: Open the back-merge pull request to develop
    needs: etiquetar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.etiquetar.outputs.version }}
    steps:
      - name: Open the pull request
        run: |
          set -euo pipefail
          adelante=$(gh api "repos/$GITHUB_REPOSITORY/compare/develop...main" --jq .ahead_by)
          if [ "$adelante" = 0 ]; then
            echo "develop already has every commit of main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          existente=$(gh pr list --repo "$GITHUB_REPOSITORY" --head main --base develop --state open --json url --jq '.[0].url // empty')
          if [ -n "$existente" ]; then
            echo "Back-merge pull request already open: $existente" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head main \
            --title "chore: merge release $VERSION back into develop" \
            --body "Brings release $VERSION (tag \`v$VERSION\`) from main back into develop. Merge with a merge commit, not a squash."; then
            echo "::error title=Pull request not opened::Open main → develop by hand. If the error says GitHub Actions cannot create pull requests, enable 'Allow GitHub Actions to create and approve pull requests' (organization or repository Settings → Actions → General)."
            exit 1
          fi
