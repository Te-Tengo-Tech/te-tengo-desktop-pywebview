name: Dependency audit

# pip-audit checks every locked Python dependency (all groups, all platforms) against the
# PyPI advisory database. Scheduled and manual runs fail on any known vulnerability;
# pull request runs (only when dependencies change) report without failing.
on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/audit.yml

permissions: {}

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Export the locked dependencies
        run: uv export --frozen --format requirements-txt --all-groups --no-emit-project --quiet -o requirements-audit.txt
      - name: Run pip-audit
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: |
          set -o pipefail
          echo "## pip-audit" >> "$GITHUB_STEP_SUMMARY"
          uvx pip-audit@2.10.1 -r requirements-audit.txt --disable-pip --progress-spinner off --format markdown --desc on \
            | tee -a "$GITHUB_STEP_SUMMARY"
