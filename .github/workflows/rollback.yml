name: Rollback

# Puts an earlier release of Te Tengo Captura back in production (docs/RELEASES.md, Rollback): the
# binaries of the published GitHub Release vX.Y.Z (or, when they were not attached, of the candidate
# recorded in its notes) are verified and uploaded again to the R2 keys the landing links to. Nothing
# is built, no tag or release is changed, and installed agents are not touched.
#
#   Actions → Rollback → Run workflow (branch main) → version x.y.z
#     verificar   the release vX.Y.Z exists and is published (not a draft or a pre-release)
#     rollback    environment `produccion` (approval): download, SHA-256 checks, R2 upload with a
#                 download check, per switch (ENABLE_WINDOWS_INSTALLER, ENABLE_MAC_DMG)
#
# The agent has no server database to restore: see docs/RELEASES.md for its local outbox and for
# TT_AGENTE_VERSION_PUBLICADA in the API. Rolling back to the current release (the same bytes) is the
# rehearsal of this workflow (docs/RELEASES.md, Rollback rehearsal).
#
# Secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID of the `produccion` environment, read only by
# the steps that upload. Each job has only the permissions it uses.
run-name: Rollback Te Tengo Captura to ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to put back in production (x.y.z of a published release vX.Y.Z)
        required: true
        type: string

permissions: {}

# Production and rollback write the same R2 keys: one at a time, never cancelled while running.
concurrency:
  group: produccion-escritorio
  cancel-in-progress: false

env:
  WRANGLER_VERSION: 4.149.0
  R2_BUCKET: ${{ vars.DESCARGAS_R2_BUCKET || 'te-tengo-descargas' }}
  DESCARGAS_BASE_URL: ${{ vars.DESCARGAS_BASE_URL }}

jobs:
  verificar:
    name: Find the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      origen: ${{ steps.release.outputs.origen }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the release
        id: release
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error title=Run it from main::Production only accepts main. Choose the branch main in Run workflow."
            exit 1
          fi
          version=${VERSION#v}
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Unexpected version::'$VERSION' is not <major>.<minor>.<patch>."
            exit 1
          fi
          tag="v$version"
          if ! datos=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets,body 2> /dev/null); then
            echo "::error title=No release $tag::There is no GitHub Release $tag. Only versions that reached production can be put back."
            exit 1
          fi
          if [ "$(jq -r '.isDraft or .isPrerelease' <<< "$datos")" = true ]; then
            echo "::error title=$tag is not a final release::$tag is a draft or a pre-release; only published final releases can be put back."
            exit 1
          fi
          # The final release when it holds the binaries; otherwise the candidate it was promoted from
          # (the same bytes; produccion.yml writes "- Candidate: vX.Y.Z-rc.N" in the notes).
          if jq -e '.assets | map(.name) | index("SHA256SUMS.txt")' <<< "$datos" > /dev/null; then
            origen=$tag
          else
            origen=$(jq -r .body <<< "$datos" | tr -d '\r' | sed -n 's/^- Candidate: \(v[0-9.]*-rc\.[0-9]*\)$/\1/p' | tail -n1)
            if [ -z "$origen" ]; then
              echo "::error title=No binaries for $tag::$tag has no binaries attached and its notes name no candidate."
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "origen=$origen" >> "$GITHUB_OUTPUT"
          echo "## Rollback to \`$tag\` (binaries from \`$origen\`)" >> "$GITHUB_STEP_SUMMARY"

  rollback:
    name: Production (R2)
    needs: verificar
    environment: produccion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.verificar.outputs.tag }}
      ORIGEN: ${{ needs.verificar.outputs.origen }}
      ENABLE_WINDOWS_INSTALLER: ${{ vars.ENABLE_WINDOWS_INSTALLER }}
      ENABLE_MAC_DMG: ${{ vars.ENABLE_MAC_DMG }}
    steps:
      - name: Check the configuration
        env:
          HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$ENABLE_WINDOWS_INSTALLER" != true ] && [ "$ENABLE_MAC_DMG" != true ]; then
            echo "::error title=No channel on::ENABLE_WINDOWS_INSTALLER and ENABLE_MAC_DMG are both off: there is nothing to put back."
            exit 1
          fi
          faltan=()
          [ "$HAS_CLOUDFLARE_API_TOKEN" = true ] || faltan+=(CLOUDFLARE_API_TOKEN)
          [ "$HAS_CLOUDFLARE_ACCOUNT_ID" = true ] || faltan+=(CLOUDFLARE_ACCOUNT_ID)
          if [ "${#faltan[@]}" -gt 0 ]; then
            echo "::error title=Cloudflare secrets missing::Not set: ${faltan[*]}. Save a Cloudflare API token with Workers R2 Storage: Edit as CLOUDFLARE_API_TOKEN and the account ID as CLOUDFLARE_ACCOUNT_ID, as secrets of the environment produccion (docs/RELEASES.md)."
            exit 1
          fi
          if [ -z "$DESCARGAS_BASE_URL" ]; then
            echo "::error title=DESCARGAS_BASE_URL missing::Set the Actions variable DESCARGAS_BASE_URL to the public URL of the $R2_BUCKET bucket, used to check each upload."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Download and verify the binaries
        run: .github/scripts/descargar_candidata.sh "$ORIGEN" candidata
      # publicar_r2.sh downloads each public URL again and compares its SHA-256 with the verified file.
      - name: Windows installer to R2
        if: vars.ENABLE_WINDOWS_INSTALLER == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          .github/scripts/publicar_r2.sh candidata/r2/te-tengo-captura-setup.exe
          te-tengo-captura-setup.exe application/vnd.microsoft.portable-executable
      - name: macOS disk image to R2
        if: vars.ENABLE_MAC_DMG == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ ! -f candidata/r2/te-tengo-captura.dmg ]; then
            echo "::warning title=No disk image in $TAG::$TAG has no .dmg, so te-tengo-captura.dmg keeps its current version."
            exit 0
          fi
          .github/scripts/publicar_r2.sh candidata/r2/te-tengo-captura.dmg te-tengo-captura.dmg application/x-apple-diskimage
      - name: Next steps
        run: |
          {
            echo
            echo "R2 serves \`$TAG\` again. Installed agents keep their version: reinstall them by hand where needed."
            echo "Set \`TT_AGENTE_VERSION_PUBLICADA=${TAG#v}\` in the API, and fix forward with a \`hotfix/x.y.z\` branch (docs/RELEASES.md)."
          } >> "$GITHUB_STEP_SUMMARY"
