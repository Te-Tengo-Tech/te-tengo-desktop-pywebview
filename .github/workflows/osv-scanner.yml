name: OSV-Scanner

# Scans uv.lock against the OSV database (PyPI and GitHub advisories). No API key needed.
# Scheduled and manual runs fail on high or critical findings; pull request runs only report.
on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/osv-scanner.yml
      - .github/scripts/osv_summary.py

permissions: {}

concurrency:
  group: osv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        continue-on-error: true # exits non-zero when it finds vulnerabilities; the next step decides
        with:
          scan-args: |-
            --lockfile=uv.lock
            --format=json
            --output-file=osv-results.json
      - name: Summary and gate
        run: |
          gate=()
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then gate=(--fail-on-high); fi
          python3 .github/scripts/osv_summary.py osv-results.json "${gate[@]}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-scanner-report
          path: osv-results.json
          if-no-files-found: warn
          retention-days: 30
