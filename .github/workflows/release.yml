name: Release

# The release candidate pipeline of Te Tengo Captura (docs/RELEASES.md): build the binaries ONCE on
# the release branch, store them as a GitHub pre-release vX.Y.Z-rc.N (the release candidate), try
# that candidate in staging and open the pull request to main. Production is produccion.yml, which
# promotes the same candidate when the pull request is merged; nothing here reaches users.
#
#   push to release/x.y.z or hotfix/x.y.z
#     preparar     version check (pyproject.toml = __version__ = the branch's x.y.z), the final tag
#                  vX.Y.Z must not exist, the build number (this workflow's run number) and the
#                  switches in the summary
#     ci           calls ci.yml on this commit (lint, types, tests): the commit is tested once, here,
#                  and the pull request into main does not test it again. `package: false`: the
#                  windows job below builds and tests the installer itself
#     e2e          the agent of this commit, headless on Linux, plays a URFD fall clip against the API
#                  image that runs in production (te-tengo-general-api's scripts/e2e.sh)
#     windows      PyInstaller build → smoke test → optional signing → Inno Setup installer → silent
#                  install/uninstall test → run artifact `windows`
#     macos        PyInstaller .app → ad-hoc signature, or Developer ID + notarization → smoke test →
#                  .dmg → run artifact `macos` (only with ENABLE_MAC_DMG)
#     candidata    the pre-release vX.Y.Z-rc.N on this commit with the installer, the disk image, the
#                  SBOM and SHA256SUMS.txt, plus build provenance and SBOM attestations; its notes
#                  record the build number, the commit, the git tree hash and the SHA-256 of every
#                  asset (run artifacts expire, the pre-release does not)
#     staging      environment `staging` (approval): downloads the candidate, verifies its SHA-256 and
#                  uploads it to R2 under staging/, then a download check of each public URL; marks
#                  the candidate "Staging: passed"
#     pull-request opens (or updates) `release: x.y.z` from the release branch to main as the GitHub
#                  App te-tengo-release-bot, so its checks run (ci-ok, release-gate, pr-title). A new
#                  push builds rc.N+1 and updates it
#   pull request touching the packaging: windows and macos only (nothing is stored or published, and
#   no signing secret is read)
#
# The candidate carries the final version inside (x.y.z, never "rc"); the rc number only names the
# pre-release. Rebuilding the same version is fine until vX.Y.Z exists (produccion.yml creates it).
#
# Switches (organization variables, Te-Tengo-Tech → Settings → Secrets and variables → Actions →
# Variables; explicit opt-in: only 'true' turns a channel on, unset means off):
#   ENABLE_STAGING                  the staging job (off: the candidate goes straight to the pull
#                                   request, marked "Staging: off")
#   ENABLE_WINDOWS_INSTALLER        te-tengo-captura-setup.exe to R2 staging/ (and to the root in
#                                   produccion.yml); the installer is always built and stored
#   ENABLE_MAC_DMG                  the macOS build and te-tengo-captura.dmg to R2
#   ENABLE_MAC_NOTARIZE             Developer ID signing + notarization of the .app and the .dmg
#
# Secrets (only on push; pull request runs never read them):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   R2 uploads (token: Workers R2 Storage: Edit), read
#                                                 only by the staging job (environment `staging`)
#   RELEASE_APP_PRIVATE_KEY + variable RELEASE_APP_ID   the pull request to main (te-tengo-release-bot)
#   Signing, read only by the windows and macos jobs, which run in environment `firma` on push:
#     MAC_DEVELOPER_ID_P12_BASE64, MAC_DEVELOPER_ID_P12_PASSWORD, APPLE_ID, APPLE_TEAM_ID,
#     APPLE_APP_SPECIFIC_PASSWORD                 only with ENABLE_MAC_NOTARIZE
#     Windows signing (optional, inert until set): AZURE_TENANT_ID, AZURE_CLIENT_ID,
#     AZURE_CLIENT_SECRET + variables AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT,
#     AZURE_CERTIFICATE_PROFILE; or WINDOWS_PFX_BASE64 and WINDOWS_PFX_PASSWORD
# Variables: DESCARGAS_BASE_URL (public URL of the bucket, for the download check) and optionally
# DESCARGAS_R2_BUCKET (default te-tengo-descargas).
on:
  push:
    branches: ["release/*", "hotfix/*"]
  pull_request:
    paths:
      - packaging/**
      - .github/workflows/release.yml
      - .github/scripts/**

permissions: {}

# One pipeline per branch. A new push queues behind a run that is building or deploying (never
# cancelled); a run still waiting for an approval may be superseded by the newer one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_VERSION: 4.149.0
  R2_BUCKET: ${{ vars.DESCARGAS_R2_BUCKET || 'te-tengo-descargas' }}
  DESCARGAS_BASE_URL: ${{ vars.DESCARGAS_BASE_URL }}
  API_IMAGE: ghcr.io/te-tengo-tech/te-tengo-general-api

jobs:
  preparar:
    name: Version and switches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      staging: ${{ steps.switches.outputs.staging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        id: version
        run: |
          set -euo pipefail
          version=$(.github/scripts/version.sh)
          rama=${GITHUB_REF_NAME#*/}
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # The branch names the version and the code carries it; release-gate.yml checks the same.
            if [ "$rama" != "$version" ]; then
              echo "::error title=Branch and version differ::Branch $GITHUB_REF_NAME, but pyproject.toml and __version__ say $version. Set version = \"$rama\" in pyproject.toml and __version__ = \"$rama\" (and its CHANGELOG section) on this branch, or rename the branch."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "::error title=Version $version already released::The tag v$version exists. Bump version in pyproject.toml and __version__ (a hotfix is the next patch version)."
              exit 1
            fi
            if ! grep -qF "## [$version]" CHANGELOG.md; then
              echo "::warning title=No CHANGELOG section::CHANGELOG.md has no '## [$version]' section; the final release notes will only link to the file. Add it on this branch."
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The build number: this workflow's run number, which only grows. It is recorded in the
          # candidate's notes as $version+<build>; the binaries carry $version.
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Switches
        id: switches
        env:
          ENABLE_STAGING: ${{ vars.ENABLE_STAGING }}
          ENABLE_WINDOWS_INSTALLER: ${{ vars.ENABLE_WINDOWS_INSTALLER }}
          ENABLE_MAC_DMG: ${{ vars.ENABLE_MAC_DMG }}
          ENABLE_MAC_NOTARIZE: ${{ vars.ENABLE_MAC_NOTARIZE }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          staging=false
          if [ "$ENABLE_STAGING" = true ] && { [ "$ENABLE_WINDOWS_INSTALLER" = true ] || [ "$ENABLE_MAC_DMG" = true ]; }; then
            staging=true
          fi
          echo "staging=$staging" >> "$GITHUB_OUTPUT"
          estado() { if [ "$1" = true ]; then echo "on"; else echo "**off** ($2 is not \`true\`)"; fi; }
          {
            echo "## Te Tengo Captura $VERSION (build $GITHUB_RUN_NUMBER)"
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              echo "Pull request: the installer and the disk image are built and tested, unsigned; nothing is stored or published."
            else
              echo "| Channel | Switch |"
              echo "|---|---|"
              echo "| Staging stage | $(estado "$ENABLE_STAGING" ENABLE_STAGING) |"
              echo "| Windows installer to R2 | $(estado "$ENABLE_WINDOWS_INSTALLER" ENABLE_WINDOWS_INSTALLER) |"
              echo "| macOS build and .dmg to R2 | $(estado "$ENABLE_MAC_DMG" ENABLE_MAC_DMG) |"
              echo "| macOS signing and notarization | $(estado "$ENABLE_MAC_NOTARIZE" ENABLE_MAC_NOTARIZE) |"
              echo
              echo "- The candidate \`v$VERSION-rc.N\` (a GitHub pre-release) is stored whatever the switches say."
              if [ "$staging" != true ]; then echo "- The \`staging\` job is skipped: the stage is off or no binary goes to R2. The candidate is marked \`Staging: off\`."; fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The candidate's commit is tested once, here (lint, types, tests); the pull request into main is not
  # tested again (release-gate.yml proves it carries this commit's tree).
  ci:
    name: CI
    needs: preparar
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    with:
      package: false
    permissions:
      contents: read

  # Hosted runners cannot run the Windows installer or the .app against a Docker stack, so this runs the
  # agent of THIS commit from source, headless on Linux (`--sin-interfaz`), against the API image that is
  # in production (`latest` moves only after the API's production deployment), with the API's own
  # end-to-end script: agent → API → CAIDA alert, push, confirmation and clip. It tests the candidate's
  # source, not its binaries; the windows and macos jobs smoke-test those.
  e2e:
    name: "End-to-end: candidate agent → production API image"
    needs: preparar
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: te-tengo-desktop-pywebview
          persist-credentials: false
      # The API repository is public: the workflow token reads it. main is the code in production.
      - name: Check out te-tengo-general-api (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Te-Tengo-Tech/te-tengo-general-api
          ref: main
          path: te-tengo-general-api
          persist-credentials: false
      - name: Production API image (by digest)
        id: image
        run: |
          set -euo pipefail
          # Anonymous: the package is public, and no credential of this repository is sent to GHCR.
          if ! digest=$(docker buildx imagetools inspect "$API_IMAGE:latest" --format '{{json .Manifest}}' | jq -re .digest); then
            echo "::error title=API image not readable::Could not resolve $API_IMAGE:latest anonymously. The GHCR package te-tengo-general-api must be public (Package settings → Change visibility) and have the tag latest (set by the API's produccion.yml after a production deployment)."
            exit 1
          fi
          image="$API_IMAGE@$digest"
          docker pull --quiet "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "API image in production: \`$image\` (\`latest\`)" >> "$GITHUB_STEP_SUMMARY"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: te-tengo-desktop-pywebview/uv.lock
      - name: System libraries for MediaPipe on Linux (OpenGL ES and EGL, even on CPU)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgles2 libegl1
      - name: Download the MediaPipe model
        working-directory: te-tengo-desktop-pywebview
        run: ./scripts/descargar_modelo.sh
      - name: Cache the URFD fall clip
        id: clip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/urfd
          key: urfd-fall-03-cam0
      - name: Download the URFD fall clip
        if: steps.clip.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/urfd"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/urfd/fall-03-cam0.mp4" \
            https://fenix.ur.edu.pl/~mkepski/ds/data/fall-03-cam0.mp4
      - name: Run the end-to-end test
        working-directory: te-tengo-general-api
        env:
          TT_E2E_ESCRITORIO: ../te-tengo-desktop-pywebview
          TT_E2E_VIDEO: ${{ runner.temp }}/urfd/fall-03-cam0.mp4
          TT_E2E_DIR: ${{ runner.temp }}/e2e
          TT_E2E_ESPERA: "180"
          TT_E2E_IMAGEN: ${{ steps.image.outputs.image }}
        run: ./scripts/e2e.sh
      - name: Summary
        if: always()
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          {
            echo "## End-to-end: agent of \`${GITHUB_SHA:0:12}\` → production API image"
            echo "API image: \`${IMAGE:-not resolved}\`; scripts/e2e.sh of te-tengo-general-api main."
            echo "The agent runs from this commit's source (headless, Linux), not from the installer or the .app."
            echo '```'
            cat "$RUNNER_TEMP/e2e/resumen.txt" 2> /dev/null || echo "No summary: the test did not start."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          # Logs only: the work directory also holds the throwaway JWT keys and agent credential.
          path: |
            ${{ runner.temp }}/e2e/*.log
            ${{ runner.temp }}/e2e/resumen.txt
            ${{ runner.temp }}/e2e/agente-logs/
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows installer
    needs: preparar
    runs-on: windows-latest
    timeout-minutes: 60
    # The signing secrets live in environment `firma` (deployment branches release/*, hotfix/*): pull
    # request runs have no environment, so they cannot read them, and every step below reads a secret
    # only on push.
    environment: ${{ github.event_name == 'push' && 'firma' || '' }}
    permissions:
      contents: read
    outputs:
      firma: ${{ steps.signing.outputs.mode }}
    env:
      VERSION: ${{ needs.preparar.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Code signing configuration
        id: signing
        shell: bash
        env:
          AZURE_LISTO: >-
            ${{ github.event_name == 'push' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != ''
            && secrets.AZURE_CLIENT_SECRET != '' && vars.AZURE_SIGNING_ENDPOINT != ''
            && vars.AZURE_SIGNING_ACCOUNT != '' && vars.AZURE_CERTIFICATE_PROFILE != '' }}
          PFX_LISTO: >-
            ${{ github.event_name == 'push' && secrets.WINDOWS_PFX_BASE64 != '' && secrets.WINDOWS_PFX_PASSWORD != '' }}
        run: |
          if [ "$AZURE_LISTO" = true ]; then
            echo "mode=azure" >> "$GITHUB_OUTPUT"
          elif [ "$PFX_LISTO" = true ]; then
            echo "mode=pfx" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
              echo "::notice title=Installer not signed::Windows SmartScreen will warn on first run. To sign, set the Azure Artifact Signing secrets and variables or WINDOWS_PFX_BASE64 and WINDOWS_PFX_PASSWORD in environment firma (docs/RELEASES.md)."
            fi
          fi

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group empaquetado
      - name: Download the MediaPipe model
        shell: bash
        run: ./scripts/descargar_modelo.sh
      - name: Build with PyInstaller
        run: uv run pyinstaller packaging/te-tengo-captura.spec --noconfirm
      - name: Smoke test the executable
        shell: pwsh
        run: |
          # A windowed exe does not block the shell: wait for it and check the exit code.
          $exe = "dist/te-tengo-captura/te-tengo-captura.exe"
          $version = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru
          if ($version.ExitCode -ne 0) { throw "--version terminó con $($version.ExitCode)" }
          $prueba = Start-Process -FilePath $exe -ArgumentList "--autoprueba","--logs","logs" -Wait -PassThru
          Get-Content logs/te-tengo-captura.log
          if ($prueba.ExitCode -ne 0) { throw "--autoprueba terminó con $($prueba.ExitCode)" }

      # 1) Sign the agent executable (before it goes into the installer).
      - name: Sign the executable (Azure Artifact Signing)
        if: steps.signing.outputs.mode == 'azure'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ github.event_name == 'push' && secrets.AZURE_TENANT_ID || '' }}
          azure-client-id: ${{ github.event_name == 'push' && secrets.AZURE_CLIENT_ID || '' }}
          azure-client-secret: ${{ github.event_name == 'push' && secrets.AZURE_CLIENT_SECRET || '' }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\dist\te-tengo-captura\te-tengo-captura.exe
          file-digest: SHA256
          timestamp-digest: SHA256
      - name: Sign the executable (PFX certificate)
        if: steps.signing.outputs.mode == 'pfx'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ github.event_name == 'push' && secrets.WINDOWS_PFX_BASE64 || '' }}
          WINDOWS_PFX_PASSWORD: ${{ github.event_name == 'push' && secrets.WINDOWS_PFX_PASSWORD || '' }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "firma.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Te Tengo Captura" dist\te-tengo-captura\te-tengo-captura.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool terminó con $LASTEXITCODE" }

      # 2) Compile the installer with Inno Setup 6 (preinstalled on windows-latest; installed if not).
      - name: Compile the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          & $iscc.FullName /Qp "/DAppVersion=$env:VERSION" packaging\te-tengo-captura.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC terminó con $LASTEXITCODE" }
          Get-ChildItem dist\instalador

      # 3) Sign the installer.
      - name: Sign the installer (Azure Artifact Signing)
        if: steps.signing.outputs.mode == 'azure'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ github.event_name == 'push' && secrets.AZURE_TENANT_ID || '' }}
          azure-client-id: ${{ github.event_name == 'push' && secrets.AZURE_CLIENT_ID || '' }}
          azure-client-secret: ${{ github.event_name == 'push' && secrets.AZURE_CLIENT_SECRET || '' }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\instalador
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-digest: SHA256
      - name: Sign the installer (PFX certificate)
        if: steps.signing.outputs.mode == 'pfx'
        shell: pwsh
        env:
          WINDOWS_PFX_PASSWORD: ${{ github.event_name == 'push' && secrets.WINDOWS_PFX_PASSWORD || '' }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "firma.pfx"
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $instalador = Get-ChildItem dist\instalador\*.exe | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Te Tengo Captura" $instalador.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool terminó con $LASTEXITCODE" }
      - name: Remove the certificate
        if: always() && steps.signing.outputs.mode == 'pfx'
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP "firma.pfx") -ErrorAction SilentlyContinue

      # 4) Install silently as this user, check the result, then uninstall and check it is gone.
      - name: Install and uninstall test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $instalador = Get-ChildItem dist\instalador\*.exe | Select-Object -First 1
          $p = Start-Process $instalador.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=instalacion.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content instalacion.log; throw "El instalador terminó con $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA "Programs\TeTengoCaptura"
          $exe = Join-Path $app "te-tengo-captura.exe"
          if (-not (Test-Path $exe)) { throw "Falta $exe" }
          $run = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").TeTengoCaptura
          # The same value the agent writes itself (src/te_tengo_captura/autoinicio.py).
          if ($run -ne "`"$exe`"") { throw "Inicio con Windows inesperado: $run" }
          $atajo = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Te Tengo Captura.lnk"
          if (-not (Test-Path $atajo)) { throw "Falta el acceso directo $atajo" }
          $v = Start-Process $exe -ArgumentList "--version" -Wait -PassThru
          if ($v.ExitCode -ne 0) { throw "--version instalado terminó con $($v.ExitCode)" }
          Write-Host "Instalado en $app; inicio con Windows: $run"

          $u = Start-Process (Join-Path $app "unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "El desinstalador terminó con $($u.ExitCode)" }
          # The uninstaller finishes from a copy in %TEMP%: wait for it.
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $app) { throw "La carpeta $app sigue después de desinstalar" }
          if ((Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").PSObject.Properties.Name -contains "TeTengoCaptura") {
            throw "El inicio con Windows sigue después de desinstalar"
          }
          if (Test-Path $atajo) { throw "El acceso directo sigue después de desinstalar" }
          Write-Host "Desinstalado sin restos"

      - name: Stable name and checksum
        shell: bash
        run: |
          mkdir -p salida
          cp dist/instalador/*.exe salida/te-tengo-captura-setup.exe
          cd salida
          sha256sum te-tengo-captura-setup.exe | tee te-tengo-captura-setup.exe.sha256
      # A run artifact only carries the files to the candidata job; the durable copy is the pre-release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: salida/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 7 }}
      - name: Summary
        shell: bash
        env:
          FIRMA: ${{ steps.signing.outputs.mode == 'none' && 'not signed (SmartScreen will warn)' || steps.signing.outputs.mode }}
        run: |
          {
            echo "### Windows installer $VERSION"
            echo "- Signing: $FIRMA"
            echo "- Smoke test and install, autostart and uninstall test: passed"
            echo "- \`$(cat salida/te-tengo-captura-setup.exe.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  macos:
    name: macOS disk image
    needs: preparar
    # Built on releases only with its switch on; always on pull requests that touch the packaging.
    if: vars.ENABLE_MAC_DMG == 'true' || github.event_name == 'pull_request'
    # Apple Silicon (arm64) runner, pinned so a new macos-latest does not change the build silently.
    runs-on: macos-15
    timeout-minutes: 90
    # The Apple secrets live in environment `firma` (deployment branches release/*, hotfix/*); pull
    # request runs have no environment and never notarize.
    environment: ${{ github.event_name == 'push' && 'firma' || '' }}
    permissions:
      contents: read
    outputs:
      firma: ${{ env.NOTARIZAR == 'true' && 'notarized' || 'ad-hoc' }}
    env:
      VERSION: ${{ needs.preparar.outputs.version }}
      APP: dist/Te Tengo Captura.app
      DMG: salida/te-tengo-captura.dmg
      # Notarization only on releases (never on pull requests), with its switch on.
      NOTARIZAR: ${{ github.event_name == 'push' && vars.ENABLE_MAC_NOTARIZE == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Import the Developer ID certificate
        if: env.NOTARIZAR == 'true'
        env:
          MAC_DEVELOPER_ID_P12_BASE64: ${{ github.event_name == 'push' && secrets.MAC_DEVELOPER_ID_P12_BASE64 || '' }}
          MAC_DEVELOPER_ID_P12_PASSWORD: ${{ github.event_name == 'push' && secrets.MAC_DEVELOPER_ID_P12_PASSWORD || '' }}
          # Only checked for presence here; the notarization step reads them.
          HAS_APPLE_ID: ${{ github.event_name == 'push' && secrets.APPLE_ID != '' }}
          HAS_APPLE_TEAM_ID: ${{ github.event_name == 'push' && secrets.APPLE_TEAM_ID != '' }}
          HAS_APPLE_APP_SPECIFIC_PASSWORD: ${{ github.event_name == 'push' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
        run: |
          set -euo pipefail
          faltan=()
          [ -n "$MAC_DEVELOPER_ID_P12_BASE64" ] || faltan+=(MAC_DEVELOPER_ID_P12_BASE64)
          [ -n "$MAC_DEVELOPER_ID_P12_PASSWORD" ] || faltan+=(MAC_DEVELOPER_ID_P12_PASSWORD)
          [ "$HAS_APPLE_ID" = true ] || faltan+=(APPLE_ID)
          [ "$HAS_APPLE_TEAM_ID" = true ] || faltan+=(APPLE_TEAM_ID)
          [ "$HAS_APPLE_APP_SPECIFIC_PASSWORD" = true ] || faltan+=(APPLE_APP_SPECIFIC_PASSWORD)
          if [ "${#faltan[@]}" -gt 0 ]; then
            echo "::error title=Notarization secrets missing::ENABLE_MAC_NOTARIZE is 'true' but these secrets are not set: ${faltan[*]}. Add them to environment firma (docs/RELEASES.md, macOS signing and notarization) or set ENABLE_MAC_NOTARIZE to anything else to ship an ad-hoc signed .dmg."
            exit 1
          fi
          llavero="$RUNNER_TEMP/firma.keychain-db"
          clave=$(openssl rand -base64 24)
          security create-keychain -p "$clave" "$llavero"
          security set-keychain-settings -lut 21600 "$llavero"
          security unlock-keychain -p "$clave" "$llavero"
          printf '%s' "$MAC_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/firma.p12"
          security import "$RUNNER_TEMP/firma.p12" -P "$MAC_DEVELOPER_ID_P12_PASSWORD" -f pkcs12 -k "$llavero" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/firma.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$clave" "$llavero" > /dev/null
          security list-keychains -d user -s "$llavero" login.keychain-db
          identidad=$(security find-identity -v -p codesigning "$llavero" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n1)
          if [ -z "$identidad" ]; then
            echo "::error title=No Developer ID Application identity::MAC_DEVELOPER_ID_P12_BASE64 has no 'Developer ID Application' certificate with its private key."
            exit 1
          fi
          echo "Signing identity: $identidad"
          # Read by the PyInstaller spec and packaging/macos/crear-dmg.sh.
          echo "TT_MACOS_IDENTIDAD_FIRMA=$identidad" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group empaquetado
      - name: Download the MediaPipe model
        run: ./scripts/descargar_modelo.sh
      - name: Build with PyInstaller
        # With TT_MACOS_IDENTIDAD_FIRMA PyInstaller signs every binary and the bundle with the Developer
        # ID, the hardened runtime and packaging/macos/entitlements.plist; without it, ad-hoc.
        run: uv run pyinstaller packaging/te-tengo-captura.spec --noconfirm
      - name: Ad-hoc signature (not notarized)
        if: env.NOTARIZAR != 'true'
        # Apple Silicon only runs signed code; with an ad-hoc signature the app opens after Open Anyway
        # in System Settings → Privacy & Security. Gatekeeper still warns: it is not notarized.
        run: codesign --force --deep --sign - --entitlements packaging/macos/entitlements.plist "$APP"
      - name: Check the bundle
        run: |
          set -euo pipefail
          codesign --verify --deep --strict "$APP" && echo "Signature valid"
          codesign --display --verbose=2 "$APP" 2>&1 | grep -E '^(Identifier|Format|Authority|Signature|TeamIdentifier|Runtime)'
          plist="$APP/Contents/Info.plist"
          echo "NSCameraUsageDescription: $(plutil -extract NSCameraUsageDescription raw "$plist")"
          version=$(plutil -extract CFBundleShortVersionString raw "$plist")
          if [ "$version" != "$VERSION" ]; then
            echo "::error::CFBundleShortVersionString is $version, expected $VERSION"
            exit 1
          fi
          # The MediaPipe model and its native library are bundled (as in the Windows build).
          test -f "$APP/Contents/Resources/models/pose_landmarker_lite.task"
          test -f "$APP/Contents/Frameworks/mediapipe/tasks/c/libmediapipe.dylib"
          lipo -archs "$APP/Contents/MacOS/te-tengo-captura"
      - name: Smoke test the app
        run: |
          set -euo pipefail
          binario="$APP/Contents/MacOS/te-tengo-captura"
          "$binario" --version
          if ! "$binario" --autoprueba --logs logs; then
            cat logs/te-tengo-captura.log
            exit 1
          fi
          grep "Autoprueba" logs/te-tengo-captura.log

      - name: Disk image
        run: packaging/macos/crear-dmg.sh "$APP" "$DMG"
      - name: Notarize and staple
        if: env.NOTARIZAR == 'true'
        env:
          APPLE_ID: ${{ github.event_name == 'push' && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ github.event_name == 'push' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ github.event_name == 'push' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
        run: |
          set -euo pipefail
          # notarytool with an Apple ID and an app-specific password (Apple: "Customizing the
          # notarization workflow"); --wait blocks until Apple accepts or rejects the submission.
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait --timeout 1h --output-format json > notarizacion.json
          cat notarizacion.json
          estado=$(plutil -extract status raw notarizacion.json)
          if [ "$estado" != Accepted ]; then
            id=$(plutil -extract id raw notarizacion.json)
            xcrun notarytool log "$id" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" || true
            echo "::error title=Notarization rejected::Apple answered $estado for submission $id (the log is above)."
            exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
      - name: Test the disk image
        run: |
          set -euo pipefail
          punto=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$punto"
          ls -l "$punto"
          "$punto/Te Tengo Captura.app/Contents/MacOS/te-tengo-captura" --version
          codesign --verify --deep --strict "$punto/Te Tengo Captura.app"
          hdiutil detach "$punto"
      - name: Checksum
        working-directory: salida
        run: shasum -a 256 te-tengo-captura.dmg | tee te-tengo-captura.dmg.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: salida/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 7 }}
      - name: Summary
        run: |
          {
            echo "### macOS disk image $VERSION"
            if [ "$NOTARIZAR" = true ]; then
              echo "- Signing: Developer ID, notarized and stapled"
            else
              echo "- Signing: ad-hoc, not notarized (Gatekeeper asks to allow it in Privacy & Security; README, Testing on macOS)"
            fi
            echo "- Size: $(du -h "$DMG" | cut -f1); smoke test (\`--version\`, \`--autoprueba\`) passed"
            echo "- \`$(cat salida/te-tengo-captura.dmg.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the keychain
        if: always() && env.NOTARIZAR == 'true'
        run: security delete-keychain "$RUNNER_TEMP/firma.keychain-db" || true

  candidata:
    name: Release candidate (GitHub pre-release)
    needs: [preparar, ci, e2e, windows, macos]
    if: >-
      !cancelled() && github.event_name == 'push'
      && needs.preparar.result == 'success' && needs.ci.result == 'success'
      && needs.e2e.result == 'success' && needs.windows.result == 'success'
      && (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the pre-release and its rc tag
      id-token: write # signs the attestations (Sigstore)
      attestations: write # stores them
    outputs:
      tag: ${{ steps.publicar.outputs.tag }}
      arbol: ${{ steps.archivos.outputs.arbol }}
    env:
      VERSION: ${{ needs.preparar.outputs.version }}
      BUILD: ${{ needs.preparar.outputs.build }}
      STAGING: ${{ needs.preparar.outputs.staging }}
      FIRMA_WINDOWS: ${{ needs.windows.outputs.firma }}
      FIRMA_MACOS: ${{ needs.macos.outputs.firma }}
      E2E_IMAGE: ${{ needs.e2e.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: ${{ runner.temp }}/salida/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.macos.result == 'success'
        with:
          name: macos
          path: ${{ runner.temp }}/salida/macos
      # The asset names carry the final version, never "rc": the final release attaches these same files.
      # $RUNNER_TEMP/candidata is outside the checkout, so the SBOM scan of the repository does not see
      # the binaries.
      - name: Candidate files
        id: archivos
        run: |
          set -euo pipefail
          CANDIDATA="$RUNNER_TEMP/candidata"
          mkdir -p "$CANDIDATA"
          cp "$RUNNER_TEMP/salida/windows/te-tengo-captura-setup.exe" "$CANDIDATA/te-tengo-captura-$VERSION-windows-setup.exe"
          if [ -f "$RUNNER_TEMP/salida/macos/te-tengo-captura.dmg" ]; then
            cp "$RUNNER_TEMP/salida/macos/te-tengo-captura.dmg" "$CANDIDATA/te-tengo-captura-$VERSION-macos.dmg"
          fi
          echo "arbol=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      # The Python dependencies bundled into the binaries, from uv.lock.
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/candidata/te-tengo-captura-${{ needs.preparar.outputs.version }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidata"
          sha256sum -- te-tengo-captura-* > "$RUNNER_TEMP/SHA256SUMS.txt"
          mv "$RUNNER_TEMP/SHA256SUMS.txt" SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/candidata/te-tengo-captura-*
      - name: SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/candidata/te-tengo-captura-*-windows-setup.exe
            ${{ runner.temp }}/candidata/te-tengo-captura-*-macos.dmg
          sbom-path: ${{ runner.temp }}/candidata/te-tengo-captura-${{ needs.preparar.outputs.version }}-sbom.spdx.json
      - name: Create the pre-release
        id: publicar
        env:
          GH_TOKEN: ${{ github.token }}
          ARBOL: ${{ steps.archivos.outputs.arbol }}
        run: |
          set -euo pipefail
          CANDIDATA="$RUNNER_TEMP/candidata"
          # rc number: one more than the highest candidate of this version, counting the rc tags and
          # the releases (a draft has no tag yet). Earlier candidates are never changed or deleted.
          ultimo=$(
            {
              git ls-remote --tags origin "refs/tags/v$VERSION-rc.*" | sed 's|.*refs/tags/||'
              gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName'
            } | awk -v p="v$VERSION-rc." 'index($0, p) == 1 { n = substr($0, length(p) + 1); if (n ~ /^[0-9]+$/) print n }' \
              | sort -n | tail -n1
          )
          n=$(( ${ultimo:-0} + 1 ))
          tag="v$VERSION-rc.$n"

          # buscar_candidata.sh (produccion.yml, release-gate.yml) reads "- Tree:" and "- Staging:",
          # descargar_candidata.sh the SHA-256 block; keep their format.
          if [ "$STAGING" = true ]; then staging=pending; else staging="off (ENABLE_STAGING off or no binary goes to R2)"; fi
          {
            echo "Release candidate $n of Te Tengo Captura $VERSION, built once by the Release workflow. The binaries carry version $VERSION; when \`$GITHUB_REF_NAME\` is merged into main, produccion.yml promotes these same files without rebuilding them (docs/RELEASES.md)."
            echo
            echo "- Version: $VERSION"
            echo "- Build: $VERSION+$BUILD"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Tree: $ARBOL"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Tests: CI (lint, types, tests) on this commit; end-to-end against $E2E_IMAGE"
            echo "- Windows installer signing: $FIRMA_WINDOWS"
            echo "- macOS disk image: ${FIRMA_MACOS:-not built (ENABLE_MAC_DMG off)}"
            echo "- Staging: $staging"
            echo
            echo "Provenance and SBOM attestations: \`gh attestation verify te-tengo-captura-$VERSION-windows-setup.exe --repo $GITHUB_REPOSITORY\`."
            echo
            echo "SHA-256:"
            echo
            echo '```'
            cat "$CANDIDATA/SHA256SUMS.txt"
            echo '```'
          } > "$RUNNER_TEMP/notas.md"
          gh release create "$tag" "$CANDIDATA"/* --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "Te Tengo Captura $VERSION-rc.$n" --notes-file "$RUNNER_TEMP/notas.md"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "## Candidate \`$tag\`"
            cat "$RUNNER_TEMP/notas.md"
          } >> "$GITHUB_STEP_SUMMARY"

  staging:
    name: Staging (R2 staging/)
    needs: [preparar, candidata]
    if: >-
      !cancelled() && needs.candidata.result == 'success'
      && needs.preparar.outputs.staging == 'true'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # marks the candidate "Staging: passed"
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.candidata.outputs.tag }}
      ENABLE_WINDOWS_INSTALLER: ${{ vars.ENABLE_WINDOWS_INSTALLER }}
      ENABLE_MAC_DMG: ${{ vars.ENABLE_MAC_DMG }}
    steps:
      - name: Check the configuration
        env:
          HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          faltan=()
          [ "$HAS_CLOUDFLARE_API_TOKEN" = true ] || faltan+=(CLOUDFLARE_API_TOKEN)
          [ "$HAS_CLOUDFLARE_ACCOUNT_ID" = true ] || faltan+=(CLOUDFLARE_ACCOUNT_ID)
          if [ "${#faltan[@]}" -gt 0 ]; then
            echo "::error title=Cloudflare secrets missing::Not set: ${faltan[*]}. Save a Cloudflare API token with Workers R2 Storage: Edit as CLOUDFLARE_API_TOKEN and the account ID as CLOUDFLARE_ACCOUNT_ID, as secrets of the environment staging (docs/RELEASES.md)."
            exit 1
          fi
          if [ -z "$DESCARGAS_BASE_URL" ]; then
            echo "::error title=DESCARGAS_BASE_URL missing::Set the Actions variable DESCARGAS_BASE_URL to the public URL of the $R2_BUCKET bucket, used to check each upload."
            exit 1
          fi
          echo "## Staging: candidate \`$TAG\` to R2 \`$R2_BUCKET/staging/\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Download and verify the candidate
        run: .github/scripts/descargar_candidata.sh "$TAG" candidata
      - name: Windows installer to staging/
        if: vars.ENABLE_WINDOWS_INSTALLER == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          .github/scripts/publicar_r2.sh candidata/r2/te-tengo-captura-setup.exe
          staging/te-tengo-captura-setup.exe application/vnd.microsoft.portable-executable
      - name: macOS disk image to staging/
        if: vars.ENABLE_MAC_DMG == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          .github/scripts/publicar_r2.sh candidata/r2/te-tengo-captura.dmg
          staging/te-tengo-captura.dmg application/x-apple-diskimage
      # produccion.yml and release-gate.yml accept only a candidate whose staging passed.
      - name: Mark the candidate
        run: |
          set -euo pipefail
          ejecucion="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body | tr -d '\r' \
            | sed "s|^- Staging: pending\$|- Staging: passed ($ejecucion)|" > notas.md
          grep -q '^- Staging: passed' notas.md \
            || { echo "::error title=No staging line::The notes of $TAG have no '- Staging: pending' line."; exit 1; }
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notas.md
      - name: Switched-off channels
        run: |
          {
            if [ "$ENABLE_WINDOWS_INSTALLER" != true ]; then echo "- Windows installer: skipped (\`ENABLE_WINDOWS_INSTALLER\` is not \`true\`)"; fi
            if [ "$ENABLE_MAC_DMG" != true ]; then echo "- macOS disk image: skipped (\`ENABLE_MAC_DMG\` is not \`true\`)"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  # After staging passed (or with staging switched off): open the pull request <release branch> → main,
  # or update it with the new candidate, as the GitHub App, so its checks run. Editing the description
  # fires `edited`, which runs release-gate again. Merging it is a human action.
  pull-request:
    name: Pull request to main
    needs: [preparar, candidata, staging]
    if: >-
      !cancelled() && needs.candidata.result == 'success'
      && (needs.staging.result == 'success'
      || (needs.staging.result == 'skipped' && needs.preparar.outputs.staging != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preparar.outputs.version }}
      BUILD: ${{ needs.preparar.outputs.build }}
      TAG: ${{ needs.candidata.outputs.tag }}
      ARBOL: ${{ needs.candidata.outputs.arbol }}
      STAGING: ${{ needs.staging.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
      ENABLE_WINDOWS_INSTALLER: ${{ vars.ENABLE_WINDOWS_INSTALLER }}
      ENABLE_MAC_DMG: ${{ vars.ENABLE_MAC_DMG }}
      ENABLE_MAC_NOTARIZE: ${{ vars.ENABLE_MAC_NOTARIZE }}
      ENABLE_DESKTOP_GITHUB_RELEASE: ${{ vars.ENABLE_DESKTOP_GITHUB_RELEASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check the release bot configuration
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          HAS_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$APP_ID" ] || [ "$HAS_KEY" != true ]; then
            echo "::error title=Release bot not configured::The organization variable RELEASE_APP_ID and the organization secret RELEASE_APP_PRIVATE_KEY (GitHub App te-tengo-release-bot) are required to open the pull request. Nothing falls back to GITHUB_TOKEN: its pull requests start no workflows."
            exit 1
          fi
      - name: Describe the candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=${DESCARGAS_BASE_URL%/}
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/candidata"
          if [ "$ENABLE_DESKTOP_GITHUB_RELEASE" = true ]; then adjuntos=" with these binaries"; else adjuntos=" (binaries not attached: \`ENABLE_DESKTOP_GITHUB_RELEASE\` off)"; fi
          {
            echo "Release $VERSION of Te Tengo Captura from \`$GITHUB_REF_NAME\`."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Candidate | [\`$TAG\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG) (GitHub pre-release) |"
            echo "| Build | \`$VERSION+$BUILD\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Tree | \`$ARBOL\` |"
            echo "| Tests | CI on this commit (lint, types, tests) and the end-to-end test against the production API image, in the pipeline run below |"
            echo "| Pipeline run | $RUN_URL |"
            echo
            echo "| Binary | Staging | Production key (after the merge) |"
            echo "|---|---|---|"
            for binario in windows macos; do
              if [ "$binario" = windows ]; then
                nombre="Windows installer"; clave=te-tengo-captura-setup.exe; switch=$ENABLE_WINDOWS_INSTALLER
              else
                nombre="macOS disk image"; clave=te-tengo-captura.dmg; switch=$ENABLE_MAC_DMG
                if [ "$ENABLE_MAC_NOTARIZE" = true ]; then nombre="$nombre (notarized)"; else nombre="$nombre (ad-hoc signed)"; fi
              fi
              if [ "$switch" != true ]; then
                echo "| $nombre | not published (switch off) | not published (switch off) |"
                continue
              fi
              if [ "$STAGING" = success ]; then s="$base/staging/$clave"; else s="skipped (\`ENABLE_STAGING\` off)"; fi
              echo "| $nombre | $s | $base/$clave |"
            done
            echo
            echo "SHA-256 of the candidate:"
            echo
            echo '```'
            cat "$RUNNER_TEMP/candidata/SHA256SUMS.txt"
            echo '```'
            echo
            echo "\`release-gate\` checks that merging puts exactly this tree into \`main\` and that the candidate passed staging (or staging is off). Merge with a merge commit. Merging runs \`produccion.yml\` on main: it finds this candidate by the tree of main, waits for an approval on \`produccion\`, verifies the SHA-256 and uploads the same files to the production keys without rebuilding. Only if something went to production does it tag \`v$VERSION\` and create the GitHub Release$adjuntos, then open the back-merge pull request to develop."
            echo
            echo "A new push to \`$GITHUB_REF_NAME\` builds the next candidate and updates this description. After the release, set \`TT_AGENTE_VERSION_PUBLICADA=$VERSION\` in the API (docs/RELEASES.md)."
          } > "$RUNNER_TEMP/cuerpo.md"
          cat "$RUNNER_TEMP/cuerpo.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Mint the release bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The App ID; GitHub accepts it as the JWT issuer like the client ID.
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-pull-requests: write
      - name: Open or update the pull request to main
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          .github/scripts/open-release-pr.sh "release: $VERSION" "$RUNNER_TEMP/cuerpo.md" \
            "New candidate [\`$TAG\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG) (commit \`${GITHUB_SHA:0:12}\`), staging $([ "$STAGING" = success ] && echo passed || echo off). The description now describes it."
