# Weekly dependency updates, opened against `develop`.
# Minor and patch updates arrive grouped in one pull request; major updates arrive one by one.
# mediapipe is pinned on purpose (docs/adr/0003): Dependabot keeps the pin unless the ADR changes.
# Branch names: dependabot/<ecosystem>/develop/<group-or-dependency>.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    ignore:
      - dependency-name: "mediapipe"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    commit-message:
      prefix: "ci(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
